/* ═══ PC表示の追加調整（後勝ちさせるため末尾に配置） ═══ */
@media(min-width:1100px){
  /* このアプリについて／設定タブは、横幅いっぱいに伸びると読みづらいので程よい幅に制限して中央寄せ */
  /* .set-scroll自体はフル幅・スクロール可能なままにして、マウスホイールがどこでも効くようにする。
     中央寄せ・幅の制限は中身（直下の子要素）だけにかける */
  .set-scroll{scrollbar-width:none;}
  .set-scroll>*{max-width:700px;margin-left:auto;margin-right:auto;}
  .set-scroll::-webkit-scrollbar{display:none;}

  /* 左上のランク番号・カテゴリタグも、余白に対して小さすぎたので一回り大きく */
  .rank-badge{min-width:26px;height:26px;border-radius:13px;font-size:var(--fs-sm);top:-10px;left:-10px;border-width:2.5px;}
  .tag{padding:2px 6px;border-radius:5px;font-size:var(--fs-xs);}

  /* 案件カードは基本2列。詳細を開いた時だけ1列にして開いたカードに横幅を回す
     （:has()で.dt-openの有無を見るだけなので、既存の開閉JSに一切手を加えず実現できる） */
  .card-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start;}
  .card-list:has(.proj-card.dt-open){grid-template-columns:1fr;}

  /* カード内の要素も一回り大きく見やすく（2列に収まる範囲で） */
  .proj-card{padding:15px 18px;}
  .pj-av{width:76px!important;height:76px!important;border-radius:17px!important;font-size:var(--fs-lg);}
  .pj-name{font-size:var(--fs-lg);}
  .sc-wrap{min-width:82px;}
  .sc-lbl{font-size:var(--fs-md);}
  .sc-val{font-size:50px;}
  .rank-md{width:46px;height:46px;font-size:20px;}
  /* 優先度・仕込みLv・仕込み額・削り額・TGE予定は同じ階層の情報なので揃える。
   案件名と期待値を主役にするため、さらに一段下げて完全に補助情報の扱いにする。
   色も彩度を落とし、主役（案件名・期待値）とのコントラストを作る */
.pj-meta1,.pj-meta2,.pj-meta3{font-size:var(--fs-xs);line-height:1.7;}
.pj-meta1 .pj-star,.pj-meta1 .pj-star-n{font-size:var(--fs-xs);}
.pj-meta1 .pj-dv,.pj-meta2 .pj-dv,.pj-meta3 .pj-dv{color:var(--t1);font-weight:600;}
/* アーリー度の見出し（.early-lbl）と同じトーンに揃える：白文字・weight600 */
.pj-meta1 .pj-lbl-row,.pj-meta2 .pj-lbl-row,.pj-meta3 .pj-lbl-row{color:var(--t1);font-weight:600;}
  .detail-toggle{font-size:14px;padding:12px 0;}

  /* 案件詳細（プロジェクト詳細／やってること／FDV換算）は3列にせず、以前と同じ縦積みのまま
     （.detail-gridは特にPC用の上書きをせず、base CSSのdisplay:flex;flex-direction:columnを使う） */

  /* カレンダーはPCでも高さを抑えめにして、予定欄までスクロールなしで見えるように */
  .cal-head-title{font-size:22px;}
  .cal-nav-btn{width:40px;height:40px;font-size:18px;}
  .cal-dow-cell{font-size:13px;padding:5px 0;}
  .cal-grid{gap:4px;}
  .cal-cell{min-height:56px;border-radius:8px;padding:5px 6px;}
  .cal-cell-num{font-size:13px;}
  .cal-cell-line{font-size:var(--fs-sm);padding:2px 5px;border-radius:5px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-cell-more{font-size:var(--fs-sm);}

  /* 本文中に貼った画像（[写真N]）は、横幅いっぱいに広がるとPCでは巨大になりすぎるので上限を設ける */
  .task-img{max-width:480px;width:100%;}
  .info-inline-img{max-width:480px;width:100%;}

  /* 「🔗コピー」ボタンはPCでは不要（右クリック等でコピーできるため） */
  .memo-copy{display:none;}
  .cal-detail{padding:20px 22px;}
  .cal-detail-date{font-size:17px;}
  .cal-entry-title{font-size:17px;}
}

.achv-toggle.open .dt-arrow{transform:rotate(180deg);}
.achv-rank-list{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.achv-rank-amt.neg{color:var(--red);}
.achv-rank-empty{font-size:var(--fs-md);color:var(--t3);padding:6px 2px;}
.achv-rank-clk{cursor:pointer;}
.achv-rank-clk:active{background:var(--b);}
.achv-pager{display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:8px;}
.achv-pg-btn{flex:0 0 auto;padding:7px 12px;border-radius:8px;border:1.5px solid var(--bb);background:var(--card2);color:var(--t1);font-size:var(--fs-md);font-weight:700;cursor:pointer;}
.achv-pg-btn:disabled{opacity:.35;cursor:default;}
.achv-pg-txt{font-size:var(--fs-md);color:var(--t3);font-weight:700;}
.strategy-bar.fold-closed{padding-bottom:0;}
/* 完了状況の行を出しているときは、閉じていても上下の余白を揃えて帯を中央に置く */
.strategy-bar.fold-closed.has-status{padding-bottom:9px;}
.strategy-bar.fold-closed>.detail-h{margin-bottom:0;border-bottom:none;border-radius:13px;}
.tl-line{min-height:1.8em;}
.tl-blank{height:8px;}
.tl-task-row{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.tl-check{flex-shrink:0;width:18px;height:18px;margin:0;appearance:none;-webkit-appearance:none;border-radius:5px;border:1.5px solid var(--bb);background:transparent;cursor:pointer;position:relative;}
.tl-check:checked{background:#3ddc86;border-color:#3ddc86;}
.tl-check:checked::after{content:'';position:absolute;left:5.5px;top:2.5px;width:4px;height:8px;border:solid #10151b;border-width:0 2.2px 2.2px 0;transform:rotate(45deg);}
.tl-task-txt{flex:1;min-width:0;}
/* タスク行の番号バッジは、チェックボックスの緑と混ざらないようグレー系にする */
.tl-task-row .tl-num{background:rgba(255,255,255,.1);color:var(--t2);box-shadow:none;font-weight:700;transform:none;}
.tip.up{border-left-color:#3ddc86;background:rgba(61,220,134,.06);}
.tip.dn{border-left-color:#ff8a3c;background:rgba(255,138,60,.06);}
.tip.note{border-left-color:#f0c04a;background:rgba(240,192,74,.06);}
.tip.up .tip-a-v b{color:#3ddc86;}
.tip.dn .tip-a-v b{color:#ff8a3c;}
/* タスク日課の完了状況（折りたたみを開かなくても分かるように見出しの直下に出す） */
.tl-status{display:flex;align-items:center;gap:8px;margin-top:9px;padding:9px 11px;border-radius:10px;
  font-size:var(--fs-sm);font-weight:600;letter-spacing:.02em;line-height:1.35;}
.tl-status-ico{flex-shrink:0;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:600;}
.tl-status-n{margin-left:auto;font-size:var(--fs-sm);font-weight:700;opacity:.8;flex-shrink:0;}
.tl-status.todo{background:rgba(255,90,90,.11);border:1px solid rgba(255,90,90,.3);color:#ff7b7b;}
.tl-status.todo .tl-status-ico{background:#ff5a5a;color:#1a1010;}
.tl-status.done{background:rgba(61,220,134,.1);border:1px solid rgba(61,220,134,.28);color:#3ddc86;}
.tl-status.done .tl-status-ico{background:#3ddc86;color:#0d1a12;}
/* 見出し「今のエアドロタスク日課」の左に置く完了状況マーク。他の見出しアイコンと同じ丸バッジで統一 */
.tl-head-status-ico{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:50%;flex-shrink:0;}
.tl-head-status-ico svg{width:12px;height:12px;}
.tl-head-status-ico.todo{background:rgba(255,90,90,.18);color:#ff5a5a;box-shadow:inset 0 0 0 1.3px rgba(255,90,90,.4);}
.tl-head-status-ico.done{background:rgba(61,220,134,.18);color:#3ddc86;box-shadow:inset 0 0 0 1.3px rgba(61,220,134,.4);}
.fold-close .dt-arrow{font-size:var(--fs-xs);opacity:.7;}
/* 案件カードの「タップで詳細」との混同を避けるため、横長・明るめの見た目で存在感を出す */
.tl-fold-btn-wide{width:100%;margin-top:8px;background:var(--acc-d);border:1.5px solid var(--acc);border-radius:9px;padding:10px 0;font-size:var(--fs-md);font-weight:600;color:var(--acc);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
.tl-fold-btn-wide.open{background:var(--acc);color:#fff;}
.tl-fold-btn .dt-arrow{font-size:var(--fs-xs);}
.tl-fold-btn.open{background:var(--acc);border-color:var(--acc);}
.tl-chip-btn .tl-chip-go{color:var(--acc);font-weight:600;font-size:13px;margin-left:1px;}
.sec-proof{display:block;width:100%;border-radius:10px;border:1.5px solid rgba(255,255,255,.22);margin:10px 0 2px;}
.w-sym.ws-g{color:var(--grn);}
.w-sym.ws-m{color:var(--ylw);}
.w-sym.ws-b{color:var(--red);}
.bni.active{color:var(--acc);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sb-today-time.tbd{color:var(--t3);background:var(--card2);}
/* DefiLlamaの取得結果と増減表示 */
.llama-out{font-size:11px;line-height:1.6;margin-top:7px;color:var(--t3);min-height:16px;word-break:break-word;white-space:pre-wrap;}
.llama-out.ok{color:#3ddc86;font-weight:700;}
.llama-out.err{color:#ff8a8a;font-weight:700;}
.ld-col{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:5px;width:100%;}
/* 収益列が無いカードは横幅に余裕があるので、7d/30d を1行に並べて縦をコンパクトにする。
   収益列がある（5列になる）場合は横幅が足りないため、従来通り2行のまま。
   横並びにするとTVL列が広がるので、他の列を圧迫しないよう伸び幅を抑える */
/* 増減(7d/30d)は収益列の有無にかかわらず、常に横1列で表示してコンパクトにする */
.ld-col{flex-direction:row;gap:10px;}
/* 横並びにすると増減の行が長くなり、min-content でTVL列が広がって行があふれる。
   TVL列は縮むことを許し、増減は折り返さずに列幅へ収める */
/* 増減が常に横並びになったので、TVL列は縮むことを許可して他の列を圧迫しないようにする */
.st-col-tvl{flex:1 1 auto;min-width:0;}
/* .st-col は align-items が既定(stretch)のため ld-col は幅いっぱいに広がる。
   justify-content が無いと中身が左に寄ってしまう（特にPCで列幅が広いと目立つ）ので中央に固定する */
.ld-col{flex-wrap:nowrap;justify-content:center;}
/* 増減は数字が主役。矢印は控えめにし、字間を詰めすぎず読める余裕を持たせる */
.ld-item{font-size:var(--fs-xs);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.35;letter-spacing:.01em;display:inline-flex;align-items:center;gap:3px;}
/* 矢印はフォントの三角形ではなく border で描く。上向き・下向きが完全に同じ大きさになる
   （フォント依存の "▴▾" は書体によって上下の見た目の大きさが揃わないため） */
/* 矢印・ラベル・数値の濃さがバラバラだったため、全て同じ薄さに統一する */
.ld-arrow{display:inline-block;width:0;height:0;opacity:.6;}
.ld-tri-up{border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-bottom:5px solid currentColor;}
.ld-tri-dn{border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:5px solid currentColor;}
.ld-tri-flat{width:6px;height:1.5px;background:currentColor;border-radius:1px;}
.ld-lbl{opacity:.6;font-weight:700;}
.ld-val{opacity:.6;}
.st-lbl-sub{font-size:var(--fs-xs);font-weight:700;opacity:.6;margin-left:2px;}
.ld-sep{font-size:var(--fs-xs);color:var(--t3);opacity:.5;}
.ld-item.up{color:#3ddc86;}
.ld-item.dn{color:#ff7b7b;}
.ld-item.flat{color:var(--t3);}
/* Perpの期間別出来高（実額＋増減率） */
.lv-box{margin-top:3px;display:flex;flex-direction:column;gap:1px;}
.lv-line{display:flex;align-items:baseline;justify-content:center;gap:4px;white-space:nowrap;}
.lv-lbl{font-size:var(--fs-xs);font-weight:600;color:var(--t3);}
.lv-val{font-size:var(--fs-sm);font-weight:600;color:var(--t1);font-variant-numeric:tabular-nums;}
.lv-pct{font-size:var(--fs-xs);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em;}
.lv-pct.up{color:#3ddc86;} .lv-pct.dn{color:#ff7b7b;} .lv-pct.flat{color:var(--t3);}
/* Perpが有料APIで取れないときの案内 */
.llama-warn{display:block;color:#f0c04a;font-weight:600;}
.llama-sub{display:block;color:var(--t3);font-weight:600;margin-top:3px;line-height:1.6;}
.llama-alt{margin-top:8px;width:100%;padding:10px;border-radius:9px;
  border:1px solid rgba(74,144,232,.5);background:rgba(74,144,232,.14);
  color:#8bbcf4;font-size:12.5px;font-weight:600;cursor:pointer;}
.llama-alt:active{background:rgba(74,144,232,.3);}
/* 自動取得の値と、その解除ボタン */
.llama-saved{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-radius:9px;background:rgba(61,220,134,.09);
  border:1px solid rgba(61,220,134,.3);}
.llama-saved-t{font-size:var(--fs-sm);font-weight:700;color:var(--t2);min-width:0;}
.llama-saved-t b{color:#3ddc86;font-size:13px;font-weight:600;margin:0 2px;}
.llama-saved-t i{font-style:normal;font-size:var(--fs-xs);color:var(--t3);margin-left:5px;}
.llama-del{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;
  border:1px solid rgba(255,124,124,.45);background:rgba(255,92,92,.12);color:#ff9b9b;cursor:pointer;}
.llama-del:active{background:rgba(255,92,92,.28);}
.llama-note-sm{font-size:var(--fs-sm);color:var(--t3);line-height:1.55;margin-top:5px;}
.flbl-note{font-size:var(--fs-xs);font-weight:700;color:#3ddc86;margin-left:6px;}
/* 起動時のTVL自動更新の進捗表示 */
.llama-auto-bar{position:fixed;left:0;right:0;bottom:calc(var(--bnav-h,64px) + env(safe-area-inset-bottom,0px));
  z-index:60;font-size:11px;color:#8bbcf4;background:rgba(20,30,48,.96);
  padding:7px 14px;border-top:1px solid rgba(74,144,232,.3);
  text-align:center;font-weight:700;backdrop-filter:blur(8px);}
.llama-why{margin-left:8px;padding:3px 10px;border-radius:14px;font-size:var(--fs-sm);font-weight:600;
  border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:var(--t1);cursor:pointer;}
/* カードの収益表示 */

/* 期待値スコアと案件名を、このカードの主役として際立たせる。
   他を軒並み一段落としたぶん、この2つは最大限に強くしてコントラストを作る。
   ほのかな光彩を足して、数字が「光って浮いて見える」ようにする */
/* 太さは700に抑えたまま、サイズと光彩(text-shadow)で存在感を出す。
   高級感は「太くする」ではなく「余白と発光」で表現する方針 */
.sc-num{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',sans-serif;
  line-height:.9;letter-spacing:-.02em;font-weight:600;
  text-shadow:0 0 22px rgba(61,220,134,.45);}
.sc-lbl{opacity:.7;letter-spacing:.06em;font-weight:600;}
.pj-name{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',sans-serif;font-weight:600;letter-spacing:.015em;line-height:1.15;}
/* 優先度・仕込みLvなどのラベルと同じ白字・細字に統一する */
.st-lbl{color:var(--t3);font-weight:500;}
/* 仕込み額・コストの値もグレーへ（優先度・仕込みLvの★は対象外）。
   他の場所で.pj-dvや.pj-burnに色指定が重複していたため、確実に効くよう最後尾に置く */
.pj-meta2 .pj-dv,.pj-burn{color:var(--t3)!important;}
/* 収益の実測値も他の統計(調達額・参加者・TVL)と同じ白で統一する */
</style>

function sanTaskNum(v){ var n=Math.round(num(v)); return (n>0&&n<100000)?n:0; }
function sanTaskFreq(o){
  var out={};
  if(o&&typeof o==='object'){
    Object.keys(o).forEach(function(k){
      var n=parseInt(k,10), v=Math.round(num(o[k]));
      if(n>=1&&n<=10&&v>=1&&v<=10)out[n]=v;
    });
  }
  return out;
}
// タスクブロックの一番下に「頻度：1/○D」の行を自動挿入する（書込アプリと同じロジック）
function injectTaskFreqLines(raw,freqMap){
  if(!raw)return raw;
  var lines=String(raw).split(/\r?\n/);
  var out=[],curNum=null,curLines=[];
  function flush(){
    if(curNum!=null){
      // 末尾の空行は頻度行より後ろに回す（頻度はタスクブロックの実質最後の行にしたい）
      var trailingBlanks=[];
      while(curLines.length&&curLines[curLines.length-1].trim()==='')trailingBlanks.unshift(curLines.pop());
      out=out.concat(curLines);
      var d=freqMap&&freqMap[curNum];
      if(d&&d>1)out.push('頻度：1/'+d+'D');
      else if(d===1)out.push('頻度：1/D');
      out=out.concat(trailingBlanks);
    }else{
      out=out.concat(curLines);
    }
    curLines=[];
  }
  lines.forEach(function(line){
    var m=line.match(/^(\s*)([0-9]\uFE0F?\u20E3|\uD83D\uDD1F)/);
    if(m){
      flush();
      curNum=/\uD83D\uDD1F/.test(m[2])?10:parseInt(m[2],10);
      curLines=[line];
    }else if(/^\s*頻度[：:]/.test(line)){
      // 過去に手書きした「頻度：」行は、自動生成のものと重複するので読み飛ばす
    }else{
      curLines.push(line);
    }
  });
  flush();
  return out.join('\n');
}
// カレンダー：{'YYYY-MM-DD':'本文'} 形式のみ許可。日付キーの形式チェックと件数・文字数の上限で防御
function sanCalendar(o){
  var out={};
  if(o&&typeof o==='object'){
    Object.keys(o).slice(0,3660).forEach(function(k){ // 約10年分あれば十分
      if(/^\d{4}-\d{2}-\d{2}$/.test(k)){
        var v=o[k],arr=[];
        if(Array.isArray(v)){
          arr=v.slice(0,20).map(function(it){
            var tm=(it&&typeof it.time==='string'&&/^\d{2}:\d{2}$/.test(it.time))?it.time:'';
            return {t:clampStr(it&&it.t,120),d:clampStr(it&&it.d,1500),time:tm};
          }).filter(function(it){return it.t||it.d;});
        }else if(typeof v==='string'&&v.trim()){
          // 旧形式（1本の文字列）からの移行：改行ごとに「お題のみ」の予定として扱う（開始時間は未設定）
          arr=v.split(/\r?\n/).filter(Boolean).slice(0,20).map(function(l){return {t:clampStr(l,120),d:'',time:''};});
        }
        if(arr.length)out[k]=sortCalEntries(arr);
      }
    });
  }
  return out;
}
// 開始時間の早い順に並べ替え（時間未設定は末尾へ、両方未設定なら現在の並びを維持）
function sortCalEntries(arr){
  return arr.slice().sort(function(a,b){
    var ta=a.time||'', tb=b.time||'';
    if(ta&&tb)return ta<tb?-1:(ta>tb?1:0);
    if(ta&&!tb)return -1;
    if(!ta&&tb)return 1;
    return 0;
  });
}
// 本文中の [[PROJ:id:名前]] トークンを「案件名＋詳細カードへボタン」に、URLをリンク＋コピーボタンに変換
function renderTaskListHtml(raw){
  if(!raw)return '';
  var re=/\[\[PROJ:(\d+):([^\]]*)\]\]/g;
  var out='',last=0,m;
  while((m=re.exec(raw))!==null){
    out+=linkifyMemo(raw.slice(last,m.index));
    var pid=m[1],fallback=m[2];
    var proj=(Array.isArray(PROJ)?PROJ:[]).find(function(p){return String(p.id)===pid;});
    if(proj){
      out+='<span class="tl-chip tl-chip-btn" onclick="event.stopPropagation();jumpToProjectAny('+pid+')">'+esc(proj.name||fallback||'（無題）')+'<span class="tl-chip-go">›</span></span>';
    }else{

    last=m.index+m[0].length;

  out+=linkifyMemo(raw.slice(last));
  return out;
}
// ── タスク日課のチェックボックス（頻度(TASK_FREQ)に応じて自動リセット。閲覧者本人の「やったか」記録用、端末内保存） ──
var TASK_CHECK_KEY='babuTaskCheckV1';
function taskCheckToday(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// 'YYYY-MM-DD'形式の日付同士の日数差（d2 - d1）
function daysBetween(d1,d2){
  var t1=new Date(d1+'T00:00:00').getTime();
  var t2=new Date(d2+'T00:00:00').getTime();
  if(!isFinite(t1)||!isFinite(t2))return 99999;
  return Math.round((t2-t1)/86400000);
}
function loadTaskChecks(){
  try{
    var raw=localStorage.getItem(TASK_CHECK_KEY);
    var obj=raw?JSON.parse(raw):null;
    if(!obj||typeof obj.done!=='object')return {done:{}};
    return obj;
  }catch(e){ return {done:{}}; }
}
function saveTaskChecks(st){
  try{ localStorage.setItem(TASK_CHECK_KEY,JSON.stringify(st)); }catch(e){}
}
// そのタスク番号が「今日時点でまだチェック済み扱いか」を頻度から判定する。
// 例えば2日に1回のタスクなら、チェックした翌日はまだ済み扱いのまま、2日後の朝に未チェックへ戻る。
// 以前の保存データ(done[n]===true の旧形式)は「今日チェックした」とみなして扱う後方互換
function isTaskCheckedNow(n){
  var st=loadTaskChecks();
  var d=st.done[n];
  if(!d)return false;
  if(d===true)d=taskCheckToday();
  var freq=(TASK_FREQ&&TASK_FREQ[n])||1;
  var diff=daysBetween(d,taskCheckToday());
  return diff>=0&&diff<freq;
}
// タスク番号nの「次にリセットされるまでの進捗」を、アーリー度と同じ横帯で可視化する。
// 一度もチェックしていないタスクは基準日が無いので、バー自体を出さない
function taskFreqBarHtml(n){
  var freq=(TASK_FREQ&&TASK_FREQ[n])||1;
  var st=loadTaskChecks();
  var d=st.done[n];
  if(!d)return '';
  if(d===true)d=taskCheckToday();
  var diff=daysBetween(d,taskCheckToday());
  if(diff<0||diff>=freq)return ''; // 期限切れ・異常値ならバーは出さない（頻度行だけ残る）
  var pct=Math.round(((diff+1)/freq)*100); // 「今日の分」を含めた進み具合として+1日で計算
  pct=Math.max(4,Math.min(100,pct));
  var left=freq-diff-1;
  var leftTxt=left<=0?'今日リセット':'あと'+left+'日でリセット';
  return '<span class="tl-freq-bar-wrap">'
    +'<span class="tl-freq-track"><span class="tl-freq-fill" style="width:'+pct+'%;"></span></span>'
    +'<span class="tl-freq-left">'+leftTxt+'</span>'
    +'</span>';
}
// 今日のタスクの完了状況（本文中の番号行を母数とする）
// ─────── 自分用モードの判定 ───────
// URLの末尾に #me を付けたときだけ、タスクのチェック機能と完了状況を出す。
// 配布しているURL（#なし）では一切表示されないので、閲覧者には見えない。
// 一度 #me で開いた端末は記憶するので、ホーム画面に追加すれば毎回付ける必要はない。
var IS_OWNER=(function(){
  try{
    if(location.hash==='#me'){ localStorage.setItem('babuOwnerMode','1'); return true; }
    if(location.hash==='#guest'){ localStorage.removeItem('babuOwnerMode'); return false; }
    return localStorage.getItem('babuOwnerMode')==='1';
  }catch(e){ return location.hash==='#me'; }
})();
function taskCheckStatus(){
  var total=0,done=0;
  String(TASKLIST||'').split(/\r?\n/).forEach(function(line){
    var m=line.match(/^(\s*)([0-9]\uFE0F?\u20E3|\uD83D\uDD1F)/);
    if(!m)return;
    var n=/\uD83D\uDD1F/.test(m[2])?10:parseInt(m[2],10);
    total++;if(isTaskCheckedNow(n))done++;
  });
  return {total:total,done:done,left:total-done};
}
function toggleTaskCheck(n,el){
  var st=loadTaskChecks();
  if(el.checked)st.done[n]=taskCheckToday(); else delete st.done[n];
  saveTaskChecks(st);
  var row=el.closest('.tl-task-row');
  if(row)row.classList.toggle('done',!!el.checked);
  updateTaskStatusBar();   // 見出し下の完了状況もその場で更新する
}
// 見出し左に出す完了状況マーク（緑チェック＝完了／赤警告＝未完了）。
// 閲覧者モードや対象タスクが無い場合は何も出さない
// 見出し左に出すマーク。オーナー(#me)は完了状況（緑チェック／赤警告）、
// それ以外（閲覧者）は元のパラシュート風アイコンのまま
var TL_HEAD_ICO_DEFAULT='<svg class="dh-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a8 8 0 0 1 16 0"></path><path d="M4 11l4.5 7.5"></path><path d="M20 11l-4.5 7.5"></path><path d="M9.5 11l1 7.5"></path><path d="M14.5 11l-1 7.5"></path><rect x="9.5" y="17.5" width="5" height="3" rx="1"></rect></svg>';
function taskHeadStatusIcon(st){

// 折りたたみを閉じずに済むよう、見出し左の状況マークだけを差し替える
function updateTaskStatusBar(){
  var wrap=document.getElementById('tl-head-status-ico');

// 行ごとに、番号（1️⃣〜🔟）で始まる行だけチェックボックス付きの行として描画する
function renderTaskListWithChecks(raw){
  if(!raw)return '';
  var lines=String(raw).split(/\r?\n/);
  var curNum=null; // 直前に見たタスク番号。「頻度：」行はこの番号のバーを表示する
  return lines.map(function(line){
    var m=line.match(/^(\s*)([0-9]\uFE0F?\u20E3|\uD83D\uDD1F)/);
    if(m){
      var n=/\uD83D\uDD1F/.test(m[2])?10:parseInt(m[2],10);
      curNum=n;
      var checked=isTaskCheckedNow(n);
      return '<label class="tl-task-row'+(checked?' done':'')+'">'
        +'<input type="checkbox" class="tl-check" '+(checked?'checked':'')+' onclick="event.stopPropagation();" onchange="toggleTaskCheck('+n+',this)">'
        +'<span class="tl-task-txt">'+renderTaskListHtml(line)+'</span>'
        +'</label>';
    }
    if(!line.trim())return '<div class="tl-blank"></div>';
    if(/^\s*頻度[：:]/.test(line)&&curNum!=null){
      return '<div class="tl-line tl-freq-line"><span>'+renderTaskListHtml(line)+'</span>'+taskFreqBarHtml(curNum)+'</div>';
    }
    return '<div class="tl-line">'+renderTaskListHtml(line)+'</div>';
  }).join('');
}
// ─────────── カレンダー（閲覧版：読み取り専用） ───────────
var calYear, calMonth; // 表示中の年月（初期値は起動時の実際の年月。ハードコードではなく毎回 new Date() から算出）
(function(){ var t=new Date(); calYear=t.getFullYear(); calMonth=t.getMonth(); })();
var calSelectedDate=null; // 'YYYY-MM-DD'
function calDateStr(y,m,d){
  return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function calShiftMonth(delta){
  calMonth+=delta;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  calSelectedDate=null; // 月を変えたら選択解除（新しい月では自動で「今日 or その月の一覧」に戻す）
  renderCalendar();
  calSlide(delta);
}
// 月が動いたことが体感で分かるよう、進んだ向きにグリッドを滑らせる
function calSlide(delta){
  var g=document.getElementById('cal-grid');
  if(!g||!delta)return;
  g.style.animation='none';
  void g.offsetWidth;                       // アニメーションを確実に再生させるための再フロー
  g.style.animation='calSlide'+(delta>0?'Next':'Prev')+' .24s cubic-bezier(.22,.61,.36,1)';
}
// 今日を含む月へ戻す
function calGoToday(){
  var t=new Date();
  var delta=(t.getFullYear()-calYear)*12+(t.getMonth()-calMonth);
  calYear=t.getFullYear();calMonth=t.getMonth();
  calSelectedDate=null;
  renderCalendar();
  calSlide(delta>0?1:delta<0?-1:0);
}
// 前後の月の日をタップした時は、その月へ移動したうえでその日を選ぶ
function calJumpTo(ds){
  var y=+ds.slice(0,4), m=+ds.slice(5,7)-1;
  var delta=(y-calYear)*12+(m-calMonth);
  calYear=y;calMonth=m;
  selectCalDate(ds);
  calSlide(delta>0?1:delta<0?-1:0);
}
function renderCalendar(){
  var titleEl=document.getElementById('cal-head-title');
  var gridEl=document.getElementById('cal-grid');
  if(!titleEl||!gridEl)return;
  titleEl.textContent=calYear+'年'+(calMonth+1)+'月';
  var today=new Date(); // 「今日」は常にその時点の実際の日付から判定（自動追従）
  var todayStr=calDateStr(today.getFullYear(),today.getMonth(),today.getDate());
  var isCurMonth=(calYear===today.getFullYear()&&calMonth===today.getMonth());
  // 今日以外の月を見ている時だけ「今日」ボタンを出す
  var tb=document.getElementById('cal-today-btn');
  if(tb)tb.style.display=isCurMonth?'none':'inline-flex';

  var firstDow=(new Date(calYear,calMonth,1).getDay()+6)%7; // 月曜=0始まりに変換（getDay()は日曜=0のため）
  var daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  var prevDays=new Date(calYear,calMonth,0).getDate();      // 前月の日数
  // 週の途中で途切れないよう、前後の月の日で埋めて常に7の倍数にする
  var cells=[];
  for(var i=firstDow-1;i>=0;i--){
    var pd=new Date(calYear,calMonth-1,prevDays-i);
    cells.push({d:prevDays-i,ds:calDateStr(pd.getFullYear(),pd.getMonth(),prevDays-i),out:true});
  }
  for(var d=1;d<=daysInMonth;d++)cells.push({d:d,ds:calDateStr(calYear,calMonth,d),out:false});
  var tail=(7-(cells.length%7))%7;
  for(var j=1;j<=tail;j++){
    var nd=new Date(calYear,calMonth+1,j);
    cells.push({d:j,ds:calDateStr(nd.getFullYear(),nd.getMonth(),j),out:true});
  }

  var html=cells.map(function(c,idx){
    var dow=idx%7;                                   // 0=月 … 5=土, 6=日
    var cls='cal-cell';
    if(c.out)cls+=' out';
    if(dow===5)cls+=' sat';
    if(dow===6)cls+=' sun';
    if(c.ds===todayStr)cls+=' today';
    if(c.ds===calSelectedDate)cls+=' selected';
    var linesHtml='';
    var entries=CALENDAR&&CALENDAR[c.ds];
    if(entries&&entries.length){
      cls+=' has-event';                             // 予定がある日はパッと分かるように
      var sorted=sortCalEntries(entries);
      var max=c.out?1:3;                             // 前後の月は控えめに1件だけ
      sorted.slice(0,max).forEach(function(it){
        linesHtml+='<div class="cal-cell-line">'+emojiToIcon(esc(it.t||'(無題)'))+'</div>';
      });
      if(sorted.length>max)linesHtml+='<div class="cal-cell-more">+'+(sorted.length-max)+'</div>';
    }
    var fn=c.out?'calJumpTo':'selectCalDate';
    return '<div class="'+cls+'" onclick="'+fn+'(\''+c.ds+'\')">'
      +'<span class="cal-cell-num">'+c.d+'</span>'+linesHtml+'</div>';
  }).join('');
  gridEl.innerHTML=html;
  renderSidebarToday(todayStr);
  // 何も選択してない時：表示中が今日を含む月なら今日を（予定があれば）自動で開き、
  // 今日に予定が無い月・他の月を見てる時はその月の予定を若い順の一覧で見せる
  if(calSelectedDate===null){
    var todayHasEntries=isCurMonth&&CALENDAR&&CALENDAR[todayStr]&&CALENDAR[todayStr].length;
    if(todayHasEntries){
      selectCalDate(todayStr);
    }else{
      renderCalMonthAgenda();
    }
  }
}
// 左右フリックで月を切り替える。縦スクロールを邪魔しないよう、横移動が明確に優勢な時だけ反応させる
(function(){
  var sx=0,sy=0,st=0,tracking=false;
  function bind(){
    var el=document.getElementById('cal-swipe');
    if(!el)return;
    el.addEventListener('touchstart',function(e){
      if(e.touches.length!==1){tracking=false;return;}
      sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();tracking=true;
    },{passive:true});
    el.addEventListener('touchmove',function(e){
      if(!tracking||e.touches.length!==1)return;
      // 縦方向に大きく動いた時点で、これはスクロール操作だと判断して追跡をやめる
      if(Math.abs(e.touches[0].clientY-sy)>28&&Math.abs(e.touches[0].clientY-sy)>Math.abs(e.touches[0].clientX-sx))tracking=false;
    },{passive:true});
    el.addEventListener('touchend',function(e){
      if(!tracking)return;
      tracking=false;
      var t=e.changedTouches[0];
      var dx=t.clientX-sx, dy=t.clientY-sy, dt=Date.now()-st;
      if(dt>700)return;                              // ゆっくりした操作は誤爆しやすいので無視
      if(Math.abs(dx)<45)return;                     // 短すぎる動きは無視
      if(Math.abs(dx)<Math.abs(dy)*1.4)return;       // 縦が優勢ならスクロールとみなす
      calShiftMonth(dx<0?1:-1);                      // 左へ払う＝次の月
    },{passive:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);
  else bind();
})();
// 選択日が無い時：表示中の月に入っている予定を日付の若い順（＝時系列順）に一覧表示する
function renderCalMonthAgenda(){
  var detail=document.getElementById('cal-detail');
  var dateEl=document.getElementById('cal-detail-date');
  var bodyEl=document.getElementById('cal-detail-body');
  if(!detail||!dateEl||!bodyEl)return;
  dateEl.textContent=calYear+'年'+(calMonth+1)+'月の予定';
  var prefix=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-';
  var dates=Object.keys(CALENDAR||{}).filter(function(k){return k.indexOf(prefix)===0;}).sort();
  if(!dates.length){
    bodyEl.innerHTML='<div class="cal-detail-empty">この月の予定はありません</div>';
  }else{
    var wdJ=['日','月','火','水','木','金','土'];
    // 日付ごとにグループ化し、見出し（例：23日（木））を1回だけ出してから、その日の予定を並べる
    bodyEl.innerHTML=dates.map(function(ds){
      var day=parseInt(ds.split('-')[2],10);
      var wd=wdJ[new Date(ds+'T00:00:00').getDay()];
      var entriesHtml=sortCalEntries(CALENDAR[ds]).map(function(it){
        var timeHtml='<span class="cal-entry-time'+(it.time?'':' cal-entry-time-tbd')+'">'+(it.time?esc(it.time):'時間未定')+'</span>';
        return '<div class="cal-entry cal-agenda-entry" onclick="selectCalDate(\''+ds+'\')">'
          +'<div class="cal-entry-title">'+timeHtml+emojiToIcon(esc(it.t||'(無題)'))+'</div>'
          +'</div>';
      }).join('');
      return '<div class="cal-agenda-group"><div class="cal-agenda-date-hdr">'+day+'日（'+wd+'）</div>'+entriesHtml+'</div>';
    }).join('');
  }
  detail.style.display='block';
}
// サイドバー下部：本日の予定をカレンダーから引っ張って表示（PCのみ表示される領域だが、常に呼んでおいて問題ない）
function renderSidebarToday(todayStr){
  var wrap=document.getElementById('sb-today');
  var list=document.getElementById('sb-today-list');
  if(!wrap||!list)return;
  var entries=CALENDAR&&CALENDAR[todayStr];

// 折りたたみを開いた時、そのカードの見出しが画面上部（少し余白を残した位置）に来るよう自動スクロール。
// ブラウザ標準のsmoothスクロールは目的地を開始時点のレイアウトで固定してしまい、
// 展開アニメーションで下に伸びる分を織り込めず途中で止まるため、
// 毎フレーム目的地を再計算しながら追従するカスタム実装にしている。
function scrollFoldTop(el,offset){
  if(!el)return;
  offset=offset||0;
  var cont=el.closest('.set-scroll,.scroll-area');
  if(!cont){ try{el.scrollIntoView();}catch(_){ } return; }
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function calcTarget(){
    var t=cont.scrollTop + el.getBoundingClientRect().top - cont.getBoundingClientRect().top - offset; // 見出しを先頭ピッタリに（offset分だけ手前で止める）
    return Math.max(0,Math.min(t,cont.scrollHeight-cont.clientHeight));
  }
  if(reduce){ cont.scrollTop=calcTarget(); return; }
  var startT=performance.now(),dur=400,from=cont.scrollTop;
  function step(now){
    var p=Math.min(1,(now-startT)/dur);
    var ease=1-Math.pow(1-p,3); // easeOutCubic
    cont.scrollTop=from+(calcTarget()-from)*ease; // 目的地は展開の伸びに合わせて毎フレーム更新
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
// なめらかな開閉アニメーションの共通処理（Web Animations API）。
// ・ブラウザにフレーム進行を任せるため、旧方式（CSSトランジション＋タイマー）のような
//   開始時のコマ落ち・終了時のカクつきが起きない
// ・アニメーション中に逆方向へタップされても、「今の高さ」から途切れず滑らかに反転する
function animateFold(el,show,after){
  if(!el){if(after)after();return;}
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var startH=null;
  if(el._foldAnim){
    startH=el.getBoundingClientRect().height; // 反転時：現在の見た目の高さを引き継ぐ
    el._foldAnim.cancel();el._foldAnim=null;
  }
  if(reduce||!el.animate){
    el.style.display=show?'block':'none';
    if(after)after();
    return;
  }
  if(show){
    el.style.display='block';
    var target=el.scrollHeight;
    el.style.overflow='hidden';
    var anim=el.animate(
      [{height:(startH!=null?startH:0)+'px',opacity:(startH!=null?1:0)},
       {height:target+'px',opacity:1}],
      {duration:340,easing:'cubic-bezier(0.22,1,0.36,1)'} // easeOutQuint：勢いよく出て、ふわっと止まる
    );
    el._foldAnim=anim;
    anim.onfinish=function(){el.style.overflow='';el._foldAnim=null;if(after)after();};
  }else{
    var from=(startH!=null)?startH:el.getBoundingClientRect().height;
    el.style.overflow='hidden';
    var anim2=el.animate(
      [{height:from+'px',opacity:1},{height:'0px',opacity:0}],
      {duration:240,easing:'cubic-bezier(0.4,0,0.6,1)'}
    );
    el._foldAnim=anim2;
    anim2.onfinish=function(){el.style.display='none';el.style.overflow='';el._foldAnim=null;if(after)after();};
  }
}

// ─────────── NEW/更新バッジ（各ユーザーのローカル基準）───────────
// NEW: 案件idが作成時タイムスタンプなので、登録から14日以内をNEW表示
// 更新: 前回訪問時に保存した各案件のハッシュと比較し、変化があれば「更新」表示（localStorageに保存＝人によって違う）
var SEEN_KEY='babu_viewer_seen_v3'; // v3: 軽量キャッシュのハッシュで汚染された旧基準(v2)を破棄
var NEW_DAYS=14;
var updatedPids={};
var updateDiffReasons={}; // {pid: ['deps','totalUsd', ...]} 何が変わって「更新」になったかの内訳（診断用）
// 「読者から見える内容」を項目ごとに分けてハッシュ化する（内部用フィールドの追加等で誤って全件"更新"扱いにならないように）
function projFieldSig(p){
  return {
    name:p.name,cat:p.cat,lv:p.lv,tge:p.tge,
    earlyStart:p.earlyStart,earlyEnd:p.earlyEnd,
    fund:p.fund,tvl:p.tvl,usr:p.usr,
    deps:p.deps,totalUsd:p.totalUsd,burnUsd:p.burnUsd,
    endDate:p.endDate,active:p.active,
    sm:p.sm,refa:p.refa,low:p.low,quality:p.quality,
    memo:p.memo,task:p.task,postUrl:p.postUrl,
    results:p.results,
    taskImgLen:(p.taskImg||[]).map(function(s){return (s||'').length;}),
    secProofLen:(p.img||'').length
  };
}
function strHash(s){
  var h=5381;
  for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}
  return h;
}
// 各項目ごとのハッシュ値を返す（{name:12345, cat:678, ...}）。項目単位で前回と比較できるようにする
function projFieldHashes(p){
  var sig=projFieldSig(p);
  var out={};
  for(var k in sig){ out[k]=strHash(JSON.stringify(sig[k])+''); }
  return out;
}
function computeUpdatedPids(){
  var prev=null;
  try{ prev=JSON.parse(localStorage.getItem(SEEN_KEY)||'null'); }catch(e){ prev=null; }
  var cur={};
  (Array.isArray(PROJ)?PROJ:[]).forEach(function(p){ if(p&&p.id!=null)cur[p.id]=projFieldHashes(p); });
  if(prev&&typeof prev==='object'){
    for(var pid in cur){
      var pv=prev[pid];
      if(pv===undefined)continue;
      var changed=[];
      // 旧バージョン（項目分けする前）は文字列や数値1個だけが入っている可能性があるため型チェック
      if(pv&&typeof pv==='object'){
        for(var k in cur[pid]){ if(pv[k]!==undefined && pv[k]!==cur[pid][k])changed.push(k); }
      }
      if(changed.length){ updatedPids[pid]=true; updateDiffReasons[pid]=changed; }
    }
  }
  // 初回訪問（prevなし）は更新バッジなし。現状を記録して次回以降の比較基準にする
  try{ localStorage.setItem(SEEN_KEY,JSON.stringify(cur)); }catch(e){}
}
// 「更新」バッジをタップした時に、具体的に何の項目が変わったのかを表示する（診断・確認用）

  endDate:'終了日',active:'仕込み中フラグ',sm:'強者の言及',refa:'リファ無',low:'低資金',quality:'運営の質',
  memo:'詳細メモ',task:'やってること',postUrl:'投稿URL',results:'エアドロ受取履歴',taskImgLen:'やってこと内の画像',secProofLen:'案件アイコン画像'};

// ─────────── スコア答え合わせ（期待値 vs 実績）───────────
var scFoldOpen=false;
// ─────── 配点の補正提案 ───────
// 「期待値スコアの予想」と「実際の結果」を突き合わせ、配点をどう動かせば精度が上がるかを提案する。
// 提案するだけで自動適用はしない（件数が少ないうちは誤った方向へ振れるため、必ず人が判断する）。
function calibrationProposal(){
  var fac=precisionFactors();
  if(!fac||fac.total<5)return null;                 // 5件未満では方向すら定まらない
  var diff={};fac.rows.forEach(function(r){diff[r.k]=r.diff;});
  var conf=Math.min(1,fac.total/20);                // 20件で信頼度1。少ないうちは提案幅を抑える

  // ── A) 強者ごとの配点（ptG / ptM）──
  // 「その人が○を付けた案件の当たり率」と「その案件の価値」を全体平均と比べ、配点を増減する
  var people=fac.stats.filter(function(s){return s.mentionN>=3;}).map(function(s){
    var q=SP[s.idx];if(!q)return null;
    var hitLift=s.hitRate-(fac.baseRate/100);       // 当たり率の差
    var valLift=s.avgValue-fac.avgValueAll;          // 拾った案件の価値の差
    var mult=1+(hitLift*0.6+valLift*0.4)*1.8*conf;
    mult=Math.max(0.5,Math.min(1.8,mult));
    function r5(v){return Math.max(0,Math.round(v*2)/2);}   // 0.5刻み
    var ng=Math.min(6,r5(num(q.ptG)*mult)), nm2=Math.min(6,r5(num(q.ptM)*mult));
    return {label:(q.name||q.handle||'?'),handle:(q.handle||''),
            n:s.mentionN,hit:s.precN,hitRate:Math.round(s.hitRate*100),
            curG:num(q.ptG),curM:num(q.ptM),newG:ng,newM:nm2,
            mult:Math.round(mult*100)/100,
            changed:(ng!==num(q.ptG)||nm2!==num(q.ptM))};
  }).filter(Boolean);
  people.sort(function(a,b){return b.mult-a.mult;});

  // ── B) 大分類の配点（w_sm / w_ef / w_deduct）──
  // 各ブロックに属する要因の実測寄与率の平均を「効き目」とし、合計100点を配分し直す
  var blocks=[
    {key:'w_sm',    label:'強者の言及',            cur:num(W.w_sm),
     keys:['強者の言及が多い(平均以上)']},
    {key:'w_ef',    label:'報酬の競争率',          cur:num(W.w_ef),
     keys:['調達額が大きい(中央値以上)','明確な自分の報酬シェア','TVLが大きい(中央値以上)','参加者が少ない(中央値以下)']},
    {key:'w_deduct',label:'減点（リファ無・低資金）',cur:num(W.w_deduct),
     keys:['リファ無し','低資金向き']}
  ];
  blocks.forEach(function(b){
    var vs=b.keys.map(function(k){return diff[k];}).filter(function(v){return v!=null;});
    b.measured=vs.length?Math.round(vs.reduce(function(a,c){return a+c;},0)/vs.length):null;
    b.raw=Math.max(0,b.measured==null?0:b.measured);   // マイナスの効き目は0として扱う
  });
  var rawSum=blocks.reduce(function(a,b){return a+b.raw;},0);
  if(rawSum>0){
    var curSum=blocks.reduce(function(a,b){return a+b.cur;},0)||100;
    blocks.forEach(function(b){
      var ideal=curSum*(b.raw/rawSum);
      var blended=b.cur*(1-0.6*conf)+ideal*(0.6*conf);   // 件数が少ないうちは現状寄りに寄せる
      b.next=Math.max(10,Math.min(60,Math.round(blended/5)*5));
    });
    // 合計が元の配点合計に一致するよう最大の枠で調整する
    var d=curSum-blocks.reduce(function(a,b){return a+b.next;},0);
    if(d!==0){
      var big=blocks.slice().sort(function(a,b){return b.next-a.next;})[0];
      big.next=Math.max(10,Math.min(60,big.next+d));
    }
  }else{
    blocks.forEach(function(b){b.next=b.cur;});
  }

  var notes=[];
  // スコアに反映されていないのに効いている要因
  [['TGE予定あり','TGE予定'],
   ['仕込みLvが高い(中央値以上)','仕込みLv'],
   ['自分の優先度が高い(中央値以上)','自分がつけた優先度'],
   ['仕込み期間が長い(中央値以上)','仕込み期間'],
   ['デポジット案件(無料系でない)','デポジットの有無']].forEach(function(x){
    var d=diff[x[0]];
    if(d!=null&&Math.abs(d)>=30){
      notes.push({t:'未使用の要因',
        b:x[1]+'（寄与率 '+(d>0?'+':'')+d+'%）',
        d:'この項目は現在スコアに一切反映されていません。'+(d>0?'加点項目として追加する価値があります。':'逆方向の指標として使える可能性があります。')});
    }
  });

  var minus=['リファ無し','低資金向き'].filter(function(k){return diff[k]!=null&&diff[k]<=-30;});
  if(minus.length){
    notes.push({t:'逆効果の疑い',
      b:minus.join('・')+' が稼げない案件の特徴として出ています',
      d:'現在これらは「○なら減点なし」として加点方向に働いています。3項目は同じ減点幅（d_m/d_b）を共有しているため個別に弱められません。分離するには項目ごとの減点値が必要です。'});

// デポジットがあれば投資案件（実績年利で判定）、無ければ無料案件（実績時給で判定）。
// どちらも計算できない（データ不足）場合は null を返す。
// 補正提案を「何をどう変えると良いか」の具体的な提案にして返す。

function calibrationTips(showNegativePeople){
  var c=calibrationProposal();
  if(!c)return null;
  var tips=[];
  // 1) 強者の配点
  c.people.forEach(function(x){
    if(x.newG>x.curG){
      tips.push({lv:'up',rank:1,impact:x.newG-x.curG,
        hd:esc(x.label)+' の言及が効いています',
        body:'○を付けた'+x.n+'件のうち'+x.hit+'件が達成（的中'+x.hitRate+'%）。全体の達成率'+c.baseRate+'%を上回っています。',
        k:'○の配点',from:x.curG,to:x.newG});
    }else if(x.newG<x.curG&&showNegativePeople){
      tips.push({lv:'dn',rank:2,impact:x.curG-x.newG,
        hd:esc(x.label)+' の言及は当たりにくい傾向',
        body:'○を付けた'+x.n+'件のうち'+x.hit+'件のみ達成（的中'+x.hitRate+'%）。全体の達成率'+c.baseRate+'%を下回っています。',
        k:'○の配点',from:x.curG,to:x.newG});
    }
  });
  // 2) 大分類の配点
  c.blocks.forEach(function(b){
    if(b.next===b.cur)return;
    var m=(b.measured==null)?'':'この分類に属する項目の実測寄与率は'+(b.measured>0?'+':'')+b.measured+'%です。';
    tips.push({lv:b.next>b.cur?'up':'dn',rank:3,impact:Math.abs(b.next-b.cur),
      hd:b.label+'の比重を'+(b.next>b.cur?'上げる':'下げる')+'余地があります',
      body:m+(b.next>b.cur?'予想に活かしきれていない可能性があります。':'予想の精度に結びついていない可能性があります。'),
      k:'配点',from:b.cur+'点',to:b.next+'点'});
  });
  // 3) 構造的な気づき
  c.notes.forEach(function(n){
    tips.push({lv:'note',rank:4,impact:0,hd:n.b,body:n.d,k:'',from:'',to:''});
  });
  // 種別ごとにまとめ、同種の中では影響の大きい順に並べる
  tips.sort(function(a,b){return (a.rank-b.rank)||(b.impact-a.impact);});
  return {tips:tips,total:c.total,conf:c.conf};

// ─────── 期待値スコアの精度検証：実績年利／実績時給から目標達成率を算出 ───────
// 無料案件の実施期間（日数）。手入力があればそれを使い、無ければ仕込み開始〜終了の日数で代用する
function workDaysOf(p){
  if(!p)return 0;
  var d=num(p.workDays);
  if(d>0)return Math.round(d);
  if(p.startDate&&p.endDate){
    var t0=new Date(p.startDate+'T00:00:00').getTime();
    var t1=new Date(p.endDate+'T00:00:00').getTime();
    if(isFinite(t0)&&isFinite(t1)&&t1>t0)return Math.max(1,Math.round((t1-t0)/86400000));
  }
  return 0;
}
// 総作業時間（時間）＝ 実施期間（日） × 1日あたりの作業工数（分） ÷ 60
function workHours(p){
  var d=workDaysOf(p), m=num(p&&p.workMin);
  return (d>0&&m>0)?(m*d)/60:0;
}
// 無料案件のカード表示用：「5分/D · 2ヶ月」のような工数表記。工数が未入力なら空
function workEffortTxt(p){
  var m=num(p&&p.workMin);
  if(!(m>0))return '';
  var d=workDaysOf(p),per='';
  if(d>0){
    var mo=d/30.44;
    if(mo>=1){var r=Math.round(mo*10)/10;per=(r%1===0?String(Math.round(r)):r.toFixed(1))+'ヶ月';}
    else per=d+'日';
  }
  return m+'分/D'+(per?' · '+per:'');
}
function actualPerfItem(p){
  if(!p.endDate||!Array.isArray(p.results)||!p.results.length)return null;
  var su=0,sj=0;
  p.results.forEach(function(r){su+=num(r.usd);sj+=num(r.jpy);});
  if(su===0&&sj===0)return null;
  var burnUsd=burnAmt(p);
  // ¥と$は「同じ受け取りを円建て・ドル建てで見せているだけ」なので足し合わせない（足すと二重計上になる）。
  // ドル建ての記録があればそれを、無ければ円建てから換算して、獲得額を1つの数値に決める。
  var grossUsd=(su!==0)?su:(sj!==0?sj/ACHV_FX:0);
  var grossJpy=(sj!==0)?sj:su*ACHV_FX;
  var netUsdEq=grossUsd-burnUsd;              // 削り額（$）を引いた手残り。散布図の縦軸はこの値
  var netJpyEq=grossJpy-burnUsd*ACHV_FX;      // 同じ手残りの円建て表現（実績時給の算出に使用）
  var principal=depShowUsd(p); // 既存の時間加重平均残高
  var type=null,actualRate=null,goalRate=null,achievePct=null;
  if(principal>0){
    var apr=calcApr(p); // カード上の「年利」バッジと同じ計算式（$のみ・calcApr）に統一。ここで円をさらに足すと二重計上になるため使わない
    if(apr!=null){
      type='invest';actualRate=apr;goalRate=W.goalApr||20;
      achievePct=goalRate>0?(apr/goalRate*100):0;
    }
  }else{
    // 実績時給＝手残り(円) ÷ 総作業時間。総作業時間は「実施期間 × 1日あたりの作業工数」で求める
    var hours=workHours(p);
    if(hours>0){
      var hourly=netJpyEq/hours;
      type='free';actualRate=hourly;goalRate=W.goalHourly||5000;
      achievePct=goalRate>0?(hourly/goalRate*100):0;
    }
  }
  // 年利・時給が算出できない案件（デポジット元本や作業時間の記録が無い等）も、
  // 縦軸が金額そのものである散布図には結果を反映する（一旦は金額のみで判定）
  // 最低獲得額チェック：基準未満なら、率がどれだけ高くても未達成扱いに抑える
  var belowMin=netUsdEq<(W.goalMinUsd||400);
  if(belowMin&&achievePct!=null&&achievePct>=100)achievePct=99;
  return {pid:p.id,name:p.name||'（無題）',sc:Math.round(score(p)),type:type,
    actualRate:actualRate!=null?Math.round(actualRate*10)/10:null,goalRate:goalRate,
    achievePct:achievePct!=null?Math.max(0,Math.round(achievePct*10)/10):null,
    netUsdEq:Math.round(netUsdEq),netJpyEq:Math.round(netJpyEq),belowMin:belowMin,
    jpy:sj,usd:su-burnUsd}; // 表示用：エアドロ実績一覧（achvAutoItems）と同じく円とドルは合算せず内訳のまま持たせる
}
// 終了済み全案件から実績算出可能なものだけを集め、4象限（正しく高評価／過小評価／過大評価／正しく低評価）に分類する
// 「開始から2年以上経ってもTGEが来ていない仕込み中案件」を未達として扱うまでの年数
var STALE_YEARS=2;
// その案件の「開始日」。アーリー度の開始を優先し、無ければ仕込み開始日を使う
function projStartDate(p){
  var d=(p&&p.earlyStart)||(p&&p.startDate)||null;
  if(!d)return null;
  var t=new Date(d+'T00:00:00').getTime();
  return isFinite(t)?t:null;
}
// 塩漬け判定：仕込み中のまま2年以上経過し、まだ結果（TGE）が出ていない案件。
// 資金と時間を拘束したまま何も得られていないので、精度の検証上は「未達」として数える。
// ※ ここでの判定は精度セクションの集計にだけ使う。カードの表示や終了タブへの移動には一切影響しない。
function isStaleNoTge(p){
  if(!p||p.endDate)return false;                                   // 終了済みは通常の集計対象
  if(Array.isArray(p.results)&&p.results.length)return false;      // 既に結果が出ているなら対象外
  var t0=projStartDate(p);
  if(t0==null)return false;
  return (Date.now()-t0)>=STALE_YEARS*365.25*86400000;
}
// 塩漬け案件を、獲得額0の未達アイテムとして組み立てる
function staleItem(p){
  var burn=burnAmt(p);
  var years=Math.floor((Date.now()-projStartDate(p))/(365.25*86400000)*10)/10;
  return {pid:p.id,name:p.name||'（無題）',sc:Math.round(score(p)),type:null,
    actualRate:null,goalRate:null,achievePct:0,
    netUsdEq:Math.round(-burn)||0,netJpyEq:Math.round(-burn*ACHV_FX)||0,
    belowMin:true,jpy:0,usd:-burn||0,stale:true,staleYears:years};
}
function precisionItems(){
  var items=[];
  (Array.isArray(PROJ)?PROJ:[]).forEach(function(p){
    if(p.endDate){
      var it=actualPerfItem(p);
      if(it)items.push(it);
    }else if(isStaleNoTge(p)){
      items.push(staleItem(p));
    }
  });
  return items;
}
// ③ 要因分析：達成した案件と未達だった案件で、各評価項目の○率がどれだけ違うかを見る。
// 差が大きい項目ほど「効いていた／外していた」と言える。件数が少ないうちは参考値。
function precisionFactors(){
  var prec=precisionSummary();
  if(!prec||prec.total<3)return null;
  var win=[],lose=[],all=[];
  prec.items.forEach(function(it){
    var p=(Array.isArray(PROJ)?PROJ:[]).find(function(x){return x.id===it.pid;});
    if(!p)return;
    all.push(p);
    (precisionIsGreen(it)?win:lose).push(p);
  });
  if(!win.length||!lose.length)return null;
  function ratio(list,fn){ if(!list.length)return 0; return list.filter(fn).length/list.length; }
  // 数値項目は「解析対象の中央値」で上下に分ける。固定のしきい値だと案件が増えた時に意味を失うため
  function med(fn){
    var vs=all.map(fn).filter(function(v){return typeof v==='number'&&isFinite(v)&&v>0;})
              .sort(function(a,b){return a-b;});
    if(vs.length<3)return null;              // データが少なすぎる項目は要因として扱わない
    if(vs[0]===vs[vs.length-1])return null;  // 全部同じ値なら分類の意味がない
    var m=Math.floor(vs.length/2);
    return vs.length%2?vs[m]:(vs[m-1]+vs[m])/2;
  }
  var mFund=med(function(p){return num(p.fund);});
  var mUsr =med(function(p){return num(p.usr);});
  var mTvl =med(function(p){return num(p.tvl);});
  var mLv  =med(function(p){return num(p.lv);});
  var mPrio=med(function(p){return num(p.prio);});
  var mDur =med(function(p){return projDurDays(p);});
  var mXScore=med(function(p){return num(p.xScore);});
  var mSmartFollowers=med(function(p){return num(p.smartFollowers);});
  var defs=[
    {k:'リファ無し',f:function(p){return p.refa==='g';}},
    {k:'低資金向き',f:function(p){return p.low==='g';}},
    {k:'明確な自分の報酬シェア',f:function(p){return p.pieShare==='g';}},
    {k:'TGE予定あり',f:function(p){return p.tge==='g';}},
    {k:'強者の言及が多い(平均以上)',f:function(p){
      var pts=(p.sm||[]).reduce(function(a,v,j){var q=SP[j];if(!q)return a;return a+(v==='g'?q.ptG:v==='m'?q.ptM:(q.ptB||0));},0);
      return pts>=smFullAuto()*0.6;
    }}
  ];
  // 数値から導く要因（中央値以上/以下）。中央値が取れた項目だけ追加する
  if(mFund!=null)defs.push({k:'調達額が大きい(中央値以上)',f:function(p){return num(p.fund)>=mFund;}});
  if(mUsr !=null)defs.push({k:'参加者が少ない(中央値以下)',f:function(p){var v=num(p.usr);return v>0&&v<=mUsr;}});
  if(mTvl !=null)defs.push({k:'TVLが大きい(中央値以上)',f:function(p){return num(p.tvl)>=mTvl;}});
  if(mLv  !=null)defs.push({k:'仕込みLvが高い(中央値以上)',f:function(p){return num(p.lv)>=mLv;}});
  if(mPrio!=null)defs.push({k:'自分の優先度が高い(中央値以上)',f:function(p){return num(p.prio)>=mPrio;}});
  if(mDur !=null)defs.push({k:'仕込み期間が長い(中央値以上)',f:function(p){var d=projDurDays(p);return d>0&&d>=mDur;}});
  if(mXScore!=null)defs.push({k:'Xスコアが高い(中央値以上)',f:function(p){return num(p.xScore)>=mXScore;}});
  if(mSmartFollowers!=null)defs.push({k:'スマートフォロワーが多い(中央値以上)',f:function(p){return num(p.smartFollowers)>=mSmartFollowers;}});
  defs.push({k:'デポジット案件(無料系でない)',f:function(p){return depShowUsd(p)>0;}});
  var rows=defs.map(function(d){
    var w=ratio(win,d.f), l=ratio(lose,d.f);

  }).filter(function(r){return r.diff!==0;});

  // 単純な的中率（○を付けた案件の当たり率）だけだと次の欠陥がある：
  //   ・○を1件だけ付けて当てた人が100%になり、母数の多い人に勝ってしまう
  //   ・当たり案件を取りこぼしても減点されない（Citreaを当てた人と外した人が同じ評価になる）
  //   ・△（弱い言及）が完全に無視され、✕と同じ扱いになる
  // そこで △を部分点(0.4) として扱ったうえで、次の3軸を合成する。
  //   ① 精度：言及した案件が実際に当たりだったか
  //   ② 網羅：当たり案件をどれだけ拾えたか（取りこぼしの少なさ）
  //   ③ 回避：外れ案件に言及していないか
  // さらに「当たりの大きさ」は獲得額と年利（目標達成率）の両方で重み付けする。
  var infoByPid={};
  prec.items.forEach(function(it){infoByPid[it.pid]=it;});
  var gMin=num(W.goalMinUsd||400)||400;
  var maxAmt=Math.max.apply(null,all.map(function(p){

  function projValue(p){
    var it=infoByPid[p.id];
    if(!it)return 0;
    var amtN=Math.log(1+Math.max(0,it.netUsdEq)/gMin)/Math.log(1+maxAmt/gMin);
    // 年利・時給の目標達成率。200%で頭打ち。算出できない案件は緑/赤から控えめに補う
    var achN=(it.achievePct!=null)?Math.min(1,it.achievePct/200):(precisionIsGreen(it)?0.6:0.15);
    return Math.max(0,Math.min(1,0.6*amtN+0.4*achN));
  }
  var vals={},totalWinV=0;
  all.forEach(function(p){
    var v=projValue(p);vals[p.id]=v;
    if(win.indexOf(p)>=0)totalWinV+=v;
  });
  var stats=SP.map(function(q,j){
    var nm=(q.name||'').trim(), hd=(q.handle||'').trim();
    if(!nm&&!hd)return null;                       // 匿名の人は名指しできないので対象外
    var w={},wsum=0;
    all.forEach(function(p){

      w[p.id]=s;wsum+=s;

    if(wsum<1)return null;                          // ○1件ぶんに満たない言及量では評価できない
    // ①精度：言及したものが当たりだったか。ここは「当たり/外れ」の二値で測る。
    //   価値の加重平均にすると、小さい当たりを拾った人が減点され、大型だけつまむ人が有利になってしまうため。
    var precisionV=all.reduce(function(a,p){
      return a+w[p.id]*(win.indexOf(p)>=0?1:0);

    // ②網羅：当たりの「価値」をどれだけ拾えたか。金額と年利の大きさはここで効かせる。
    var recallV=totalWinV>0?win.reduce(function(a,p){return a+w[p.id]*vals[p.id];},0)/totalWinV:0;

    // ── 表示用の実数（スコアとは別に、人が読んで分かる形で出す）──
    var mentioned=all.filter(function(p){return w[p.id]>0;});
    var mentionedWin=mentioned.filter(function(p){return win.indexOf(p)>=0;});
    var avoidedLose=lose.filter(function(p){return w[p.id]===0;});
    var amtList=mentionedWin.map(function(p){return (infoByPid[p.id]||{}).netUsdEq||0;});
    var achList=mentionedWin.map(function(p){return (infoByPid[p.id]||{}).achievePct;})
                            .filter(function(v){return v!=null;});
    function avg(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
    return {label:nm||('@'+hd),handle:hd,idx:j,
      score:0.35*precisionV+0.45*recallV+0.20*avoidV,

      precN:mentionedWin.length,mentionN:mentioned.length,  // 言及のうち何件が当たりか

          baseRate:Math.round(win.length/all.length*100),total:all.length};

// 仕込み期間（日数）。開始〜終了が揃っている案件のみ。要因分析の中央値スプリットに使う
function projDurDays(p){
  if(!p||!p.startDate||!p.endDate)return 0;
  var t0=new Date(p.startDate+'T00:00:00').getTime();
  var t1=new Date(p.endDate+'T00:00:00').getTime();
  if(!isFinite(t0)||!isFinite(t1)||!(t1>t0))return 0;
  return Math.round((t1-t0)/86400000);
}
// 緑＝「獲得額が最低ライン以上」かつ「期待値（年利/時給の目標）を達成している」の両方を満たす場合のみ。

function precisionIsGreen(it){
  if(it.netUsdEq<(W.goalMinUsd||400))return false;
  if(it.achievePct==null)return true;
  return it.achievePct>=100;
}
function precisionSummary(){

// 期待値スコアの精度：スコア(横軸)×目標達成率(縦軸)の4象限散布図
// 右上=正しく高評価(緑)／左上=過小評価(青)／右下=過大評価(橙)／左下=正しく低評価(グレー)
var _precPopItems={};
function buildPrecisionScatterSvg(summary){
  var items=summary.items;
  if(!items.length)return '';
  var svgW=300,svgH=228,padL=43,padR=12,padT=18,padB=26;
  var plotW=svgW-padL-padR, plotH=svgH-padT-padB;
  var goalMin=num(W.goalMinUsd||400); // 獲得額のライン（$400）。これ以上 or 期待値クリアで緑
  var vals=items.map(function(it){return it.netUsdEq;});
  var maxV=Math.max.apply(null,vals.concat([goalMin]));
  var minV=Math.min.apply(null,vals.concat([0]));
  // 縦軸の上限は結果の最大値に合わせて自動調整（キリのいい値へ切り上げ）。固定キャップにしないので頭打ちで潰れない
  function niceCeil(v){
    if(!(v>0))return 100;
    var mag=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)), n=v/mag;
    var m=n<=1?1:n<=1.25?1.25:n<=1.5?1.5:n<=2?2:n<=2.5?2.5:n<=3?3:n<=4?4:n<=5?5:n<=6?6:n<=8?8:10;
    return m*mag;
  }
  var capTop=Math.max(niceCeil(maxV*1.05),goalMin*2);
  var capBottom=minV<0?-niceCeil(Math.abs(minV)*1.1):0;
  var range=capTop-capBottom;
  // 横軸は実際のスコア範囲に合わせて自動トリミング（0〜20など出現しない範囲を切り捨てて横幅を活かす）
  var scs=items.map(function(it){return it.sc;});
  var xLo=Math.max(0,Math.floor((Math.min.apply(null,scs)-6)/10)*10);
  var xHi=Math.min(100,Math.ceil((Math.max.apply(null,scs)+6)/10)*10);
  if(xHi-xLo<30){                       // 範囲が狭すぎると点が団子になるので最低30は確保する
    xLo=Math.max(0,Math.min(70,Math.round(((xLo+xHi)/2-15)/10)*10));
    xHi=Math.min(100,xLo+30);
  }
  function px(sc){ return padL+((Math.max(xLo,Math.min(xHi,sc))-xLo)/(xHi-xLo))*plotW; }
  function py(v){ var c=Math.max(capBottom,Math.min(capTop,v)); return padT+(1-(c-capBottom)/range)*plotH; }
  var lineY=py(goalMin);
  function fmtAxisUsd(v){
    var sign=v<0?'-':'';
    var a=Math.abs(v);
    if(a>=1000){
      var k=Math.round(a/100)/10;                 // 0.1K単位まで保持（12500→12.5K。丸めて13Kにしない）
      return sign+'$'+(k%1===0?k.toFixed(0):k)+'K';
    }
    return sign+'$'+Math.round(a);
  }
  // 目盛り候補を「重要な順」に並べ、上から採用しつつ既存ラベルと11px以上離れているものだけ残す。
  // （$500 と $0 と -$500 のように値が近いと、ラベルが物理的に重なって読めなくなるのを防ぐ）
  function niceStep(span){
    var raw=span/3, mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)), n=raw/mag;
    return (n>=3?5:n>=1.5?2:1)*mag;
  }
  var cands=[capTop,goalMin];
  var st=niceStep(capTop-capBottom);
  for(var t=Math.ceil((goalMin+1)/st)*st;t<capTop;t+=st)cands.push(t);
  cands.push(0);
  if(capBottom<0)cands.push(capBottom);
  var yTicks=[],usedY=[];
  cands.forEach(function(v){
    if(v>capTop||v<capBottom)return;
    var y=py(v);
    for(var i=0;i<usedY.length;i++){ if(Math.abs(usedY[i]-y)<16)return; }
    usedY.push(y);yTicks.push(v);
  });
  // 横軸の目盛りもトリミング後の範囲から生成する（両端を優先し、重なる中間目盛りは間引く）
  var xSpan=xHi-xLo, xStep=xSpan<=60?10:20;
  var xCands=[xLo,xHi];
  for(var xv=Math.ceil((xLo+1)/xStep)*xStep; xv<xHi; xv+=xStep) xCands.push(xv);
  var xTicks=[],usedX=[];
  xCands.forEach(function(v){
    var x=px(v);
    for(var i=0;i<usedX.length;i++){ if(Math.abs(usedX[i]-x)<26)return; }
    usedX.push(x);xTicks.push(v);
  });
  xTicks.sort(function(a,b){return a-b;});
  // 未達ゾーン（$500ライン以下）だけを薄く赤で示す。達成側はベタ塗りせず、細いグリッド線だけで高さを読ませる
  var bands='<rect x="'+padL+'" y="'+lineY+'" width="'+plotW+'" height="'+(padT+plotH-lineY)+'" fill="rgba(255,90,90,.055)"></rect>';
  var grid=yTicks.map(function(v){
    if(v===goalMin)return '';
    return '<line x1="'+padL+'" y1="'+py(v)+'" x2="'+(padL+plotW)+'" y2="'+py(v)+'" stroke="rgba(255,255,255,.055)" stroke-width="1"></line>';
  }).join('')
    +xTicks.map(function(v){
      if(v===xLo)return '';   // 左端は軸線と重なるので描かない
      return '<line x1="'+px(v)+'" y1="'+padT+'" x2="'+px(v)+'" y2="'+(padT+plotH)+'" stroke="rgba(255,255,255,.045)" stroke-width="1"></line>';
    }).join('');
  var lines='<line x1="'+padL+'" y1="'+lineY+'" x2="'+(padL+plotW)+'" y2="'+lineY+'" stroke="#ff5a5a" stroke-width="1.1" stroke-dasharray="4,3" stroke-opacity=".75"></line>'
    +'<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+plotH)+'" stroke="rgba(255,255,255,.12)" stroke-width="1"></line>';
  var axis=xTicks.map(function(v){
    return '<text x="'+px(v)+'" y="'+(svgH-9)+'" font-size="8.5" fill="var(--t3)" text-anchor="middle">'+v+'</text>';
  }).join('')
    +yTicks.map(function(v){
      var isLine=(v===goalMin);
      return '<text x="'+(padL-6)+'" y="'+(py(v)+3)+'" font-size="8.5" fill="'+(isLine?'#ff5a5a':'var(--t3)')+'" font-weight="'+(isLine?'700':'400')+'" text-anchor="end">'+fmtAxisUsd(v)+'</text>';
    }).join('')
    +'<text x="'+padL+'" y="'+(padT-6)+'" font-size="8.5" fill="var(--t3)" letter-spacing=".4">獲得額</text>'
    +'<text x="'+(padL+plotW)+'" y="'+(lineY+10)+'" font-size="7.5" fill="#ff5a5a" fill-opacity=".8" text-anchor="end">未達ライン</text>';
  // ── トレンド線（最小二乗法の回帰直線）──
  // 「スコアが高い案件ほど実際に稼げているか」を一目で判定できるようにする。
  // 右上がりならスコアが機能している、水平/右下がりなら機能していない。
  var trend='',trendInfo=null;
  (function(){
    var n=items.length;

    var mx=0,my=0;
    items.forEach(function(it){mx+=it.sc;my+=it.netUsdEq;});
    mx/=n;my/=n;
    var sxy=0,sxx=0,syy=0;
    items.forEach(function(it){
      var dx=it.sc-mx,dy=it.netUsdEq-my;
      sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy;
    });
    if(sxx<=0||syy<=0)return;                        // スコアが全部同じ等、傾きが定まらない場合は引かない
    var slope=sxy/sxx, intercept=my-slope*mx;
    var r=sxy/Math.sqrt(sxx*syy);                    // 相関係数（-1〜1）
    function yAt(x){return slope*x+intercept;}
    // 直線がプロット枠から出る場合は、枠内に収まる区間だけを描く
    var x0=xLo,x1=xHi,y0=yAt(xLo),y1=yAt(xHi);
    function clampSeg(){
      [[capTop,'>'],[capBottom,'<']].forEach(function(lim){
        var v=lim[0],over=lim[1];
        function out(y){return over==='>'?y>v:y<v;}
        if(out(y0)&&out(y1))return;
        if(out(y0)){ x0=(v-intercept)/slope; y0=v; }
        else if(out(y1)){ x1=(v-intercept)/slope; y1=v; }
      });
    }
    clampSeg();
    x0=Math.max(xLo,Math.min(xHi,x0));x1=Math.max(xLo,Math.min(xHi,x1));
    if(!(isFinite(x0)&&isFinite(x1))||Math.abs(x1-x0)<(xHi-xLo)*0.02)return;
    trend='<line x1="'+px(x0)+'" y1="'+py(yAt(x0))+'" x2="'+px(x1)+'" y2="'+py(yAt(x1))+'"'
      +' stroke="var(--acc)" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round" stroke-opacity=".95"></line>';
    trendInfo={r:r,up:slope>0};
  })();
  var pts=items.map(function(it){
    var green=precisionIsGreen(it);
    var cx=px(it.sc), cy=py(it.netUsdEq), c=green?'#3ddc86':'#ff5a5a';
    _precPopItems[it.pid]=it;
    return '<g style="cursor:pointer;" onclick="showPrecPop('+it.pid+')">'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="9" fill="'+c+'" fill-opacity=".13"></circle>'
      +'<circle id="prec-dot-'+it.pid+'" class="prec-dot" cx="'+cx+'" cy="'+cy+'" r="4.6" fill="'+c+'" stroke="var(--card2)" stroke-width="1.4"></circle>'
      +'</g>';
  }).join('');
  // トレンド線の意味を日本語で言い切る（グラフだけ見て判断に迷わないように）
  var trendNote='';
  if(trendInfo){
    var ar=Math.abs(trendInfo.r), verdict, cls;
    if(!trendInfo.up&&ar>=0.2){ verdict='高く見た案件ほど稼げていない（スコアが逆行）'; cls='bad'; }
    else if(ar<0.2){ verdict='スコアと結果はほぼ無関係（スコアが効いていない）'; cls='bad'; }
    else if(ar<0.5){ verdict='スコアが高い案件ほどゆるく稼げている'; cls='mid'; }
    else{ verdict='スコアが高い案件ほど実際に稼げている'; cls='good'; }
    trendNote='<div class="prec-trend '+cls+'">'
      +'<span class="prec-trend-line"></span>'
      +'<span class="prec-trend-txt">'+verdict+'</span>'
      +'<span class="prec-trend-r">相関 '+(trendInfo.r>0?'+':'')+(Math.round(trendInfo.r*100)/100).toFixed(2)+'</span>'
      +'</div>';
  }
  return '<div class="prec-scatter-wrap">'
    +'<svg viewBox="0 0 '+svgW+' '+svgH+'" class="prec-scatter-svg">'+bands+grid+lines+axis+trend+pts+'</svg>'
    +'<div class="prec-axis-x">期待値スコア →</div>'
    +trendNote
    +'<div class="prec-pop" id="prec-pop" style="display:none;">'
    +'<div class="pp-row"><span class="pp-score" id="prec-pop-score"></span><span class="pp-name" id="prec-pop-name"></span></div>'
    +'<div class="prec-pop-mid" id="prec-pop-mid"></div>'
    +'<div class="pp-bottom"><span class="pp-amt" id="prec-pop-amt"></span><button class="pp-btn" id="prec-pop-btn">詳細カードへ ›</button></div>'
    +'</div>'
    +'</div>';
}

          +(tp.avgAch!=null?'<span class="fac-detail-m"><b>'+Math.round(tp.avgAch)+'%</b>目標達成率<i>年利・時給</i></span>':'')
          +'<span class="fac-detail-m"><b>'+pct(tp.avoidedN,tp.loseN)+'</b>外れを回避<i>'+tp.avoidedN+'/'+tp.loseN+'件</i></span>'

        +'</div>';

function emojiToIcon(line){
  var m=line.match(/^([\u2600-\u27BF\uD83C-\uDBFF][\uDC00-\uDFFF]?\uFE0F?)\s*/);
  if(!m)return line;
  var ico=EMOJI_ICON_MAP[m[1]];
  if(!ico)return line;
  return ico+line.slice(m[0].length);
}
// 1行を安全にHTML化：[写真N]トークンを画像に置換 → リンク自動化（linkifyMemo）→ **太字**→ 先頭絵文字→アイコン
function infoLineHtml(line,imgs){
  // 先に linkifyMemo で全体をエスケープしてから、最後に[写真N]を<img>に置換する。
  // 逆順だとlinkifyMemo内部のesc()で<img>タグごとエスケープされてしまう
  var html=emojiToIcon(linkifyMemo(line).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'));
  html=html.replace(/\[写真(\d+)\]/g,function(m,n){
    var d=imgs&&imgs[parseInt(n,10)-1];
    return d?'<img class="info-inline-img" src="'+esc(d)+'">':'';
  });
  return html;
}

function renderInfoText(){
  // 「注意事項」欄がまだ空の場合、旧「このアプリについて」本文の中の「――――」区切り線より下を
  // 表示上だけ注意事項側に振り分ける（書込アプリで新欄に移すまでの一時的な後方互換措置）
  var aboutRaw=String(INFO.about||'');
  var cautionRaw=String(INFO.caution||'');
  var splitAbout=aboutRaw, splitCaution=cautionRaw;
  if(!cautionRaw.trim()){
    var m=aboutRaw.match(/^[ \t]*[―\-─—]{3,}[ \t]*$/m);
    if(m){
      splitAbout=aboutRaw.slice(0,m.index).replace(/\s+$/,'');
      splitCaution=aboutRaw.slice(m.index+m[0].length).replace(/^\s+/,'');
    }
  }
  var effective={};
  INFO_KEYS.forEach(function(k){ effective[k]=INFO[k]; });
  effective.about=splitAbout;
  effective.caution=splitCaution;
  INFO_KEYS.forEach(function(k){
    var el=document.getElementById('info-'+k);
    if(!el)return;
    var imgs=(INFO_IMG&&INFO_IMG[k])||[];
    el.innerHTML=String(effective[k]||'').split(/\r?\n/).map(function(line){
      var t=line.trim();
      if(!t)return '';
      var cls=(t.charAt(0)==='※')?'info-p info-note':'info-p';
      return '<p class="'+cls+'">'+infoLineHtml(t,imgs)+'</p>';
    }).filter(Boolean).join('');
  });
  var cautionCard=document.getElementById('caution-card');
  if(cautionCard)cautionCard.style.display=splitCaution.trim()?'':'none';
}

  else if(diffMin<60*24)rel=Math.floor(diffMin/60)+'時間前';
  else{

  if(a>=100) return (p>=0?'+':'-')+Math.round(a)+'%';

  return (a||b)?('<div class="ld-col">'+a+b+'</div>'):'';
}

    workDays:Math.max(0,Math.round(num(o.workDays))), // 作業を実施した期間（日）。未入力なら仕込み開始〜終了の日数で代用

    llamaFee:sanLlamaFee(o.llamaFee),  // 書込アプリが取得した収益（表示専用）

    xScore:Math.max(0,Math.round(num(o.xScore))), // X総合スコア（書込アプリで手入力。表示専用・採点には使わない）
    tge:(o.tge==='g'||o.tge==='m'||o.tge==='b')?o.tge:'',
    earlyStart:/^\d{4}-\d{2}-\d{2}$/.test(o.earlyStart)?o.earlyStart:null,
    earlyEnd:/^\d{4}-\d{2}-\d{2}$/.test(o.earlyEnd)?o.earlyEnd:null,

// 受取履歴をサニタイズ＋旧データ移行
function sanResults(o){
  var arr=[];
  if(Array.isArray(o.results)){
    arr=o.results.slice(0,200).map(function(r){
      return {usd:num(r&&r.usd),jpy:num(r&&r.jpy),
        date:/^\d{4}-\d{2}-\d{2}$/.test(r&&r.date)?r.date:null};
    }).filter(function(r){return r.usd!==0||r.jpy!==0;});
  }
  // 旧形式（resultUsd/resultJpy/resultDate）を1件として取り込み
  if(!arr.length&&(num(o.resultUsd)!==0||num(o.resultJpy)!==0)){
    arr.push({usd:num(o.resultUsd),jpy:num(o.resultJpy),
      date:/^\d{4}-\d{2}-\d{2}$/.test(o.resultDate)?o.resultDate:null});
  }
  return arr;
}

// SCORE
// 期待値スコア（100点満点）: 強い人の言及 + 調達効率 + 減点方式の3ブロック
// 記入済み案件の調達効率スコアの中央値（未記入案件の暫定値に使う。5件未満は半分点にフォールバック）
function _effMedianCache(){
  var vals=[];
  (Array.isArray(PROJ)?PROJ:[]).forEach(function(q){
    if(q&&q.fund){
      var parts=[];
      if(q.usr)parts.push(Math.min((q.fund/q.usr)/(W.ef_full||25),1));
      if(q.tvl)parts.push(Math.min((q.fund/q.tvl)/(W.et_full||3),1));
      var n=parts.length?parts.reduce(function(a,b){return a+b;},0)/parts.length:0;
      vals.push(n*(W.w_ef||0));
    }
  });
  if(vals.length<5)return null; // 母数が少ないうちは中央値を使わない
  vals.sort(function(a,b){return a-b;});
  var m=Math.floor(vals.length/2);
  return vals.length%2?vals[m]:(vals[m-1]+vals[m])/2;
}
// 「全員が○だった場合の合計pt」＝強者の言及の満点ライン。配点を変えても自動で追従する
function smFullAuto(){
  var t=(Array.isArray(SP)?SP:[]).reduce(function(a,q){return a+(q&&q.ptG?q.ptG:0);},0);
  return t>0?t:12; // 誰も登録されていない時の保険
}
// ○△✕を点数に変換（○=満点／△=半分／✕=0）
function markScore(v,full){ return v==='g'?full:(v==='m'?full/2:0); }
// 報酬パイ・シェア率は同じ25点枠の指標なので、効率スコアの真下に記号だけ小さく添える。
// 未判断（空）の項目は出さないので、入力していない案件では何も増えない
function pieShareHtml(p){
  if(!p.pieShare)return '';
  return '<div class="st-pie">パイ'+msym(p.pieShare)+'</div>';
}
// スコア凍結を使うかどうか。
// 本来の凍結は「結果を知る前の予想」を残すためのものだが、アルゴリズムを調整している間は
// 古い基準のスコアが混ざって比較にならないため、既定では使わず常に最新ロジックで再計算する。
// 過去の凍結データ自体は消さずに保存し続けているので、算出方法が固まったら true に戻せば元の挙動になる。
var USE_FROZEN_SCORE=false;
// スコア計算に使うTVL（M$）。自動取得した値があればそれを優先する。
// 取得値はドル単位なので M$ に直してから使う。
function effTvl(p){
  if(p&&p.llama&&isFinite(p.llama.cur)&&p.llama.cur>0)return p.llama.cur/1e6;
  return num(p&&p.tvl);
}
function scoreConfidence(p,bd){
  var items=[!!p.fund, !!p.usr, !!(p.llama||p.tvl), !!p.pieShare, !!p.refa, !!p.low,
    Array.isArray(p.sm)&&p.sm.some(function(v){return v;})];
  var filled=items.filter(Boolean).length;
  var rate=filled/items.length;
  if(bd&&bd.effImputed)rate-=0.15;   // 調達効率が中央値による暫定値の場合は確度を下げる
  if(rate>=0.85)return 'g';
  if(rate>=0.5)return 'm';
  return 'b';
}
// ○=満点・△=満点の50%・✕=0点 の達成率。scoreBreakdown()とカード表示側の
// 両方から同じ関数を呼ぶことで、採点結果と画面表示が食い違わないようにする
function achieveRate(v){ return v==='g'?1:(v==='m'?0.5:0); }
function scoreBreakdown(p){
  if(USE_FROZEN_SCORE&&p&&p.frozen&&typeof p.frozen.total==='number'){
    var fz=p.frozen;
    return {total:fz.total, sm:fz.sm||0, eff:fz.eff||0, deduct:fz.deduct||0, smPts:fz.smPts||0, effImputed:!!fz.effImputed, frozen:true};
  }
  var smPts=(p.sm||[]).reduce(function(a,v,j){var q=SP[j];if(!q)return a;return a+(v==='g'?q.ptG:v==='m'?q.ptM:(q.ptB||0));},0);
  // 満点ラインは「登録者全員が○だった場合の合計pt」から毎回自動算出（配点を変えてもズレない）
  var smFull=smFullAuto();
  // 「プロジェクトの質」は 強者の言及＋Xスコア＋スマートフォロワー の3要素を合算する。
  // 旧「運営の質」が担っていた配点(w_sm_bonus)を、後者2つに割り振っている
  var smBaseScore=Math.max(0,Math.min(smPts/smFull,1))*(W.w_sm||0);
  var xBonus=xScoreBonus(p.xScore);
  var sfBonus=smartFollowerBonus(p.smartFollowers);
  var smScore=smBaseScore+xBonus+sfBonus;
  // 報酬パイ・シェア率（○△✕の手動判断）と調達効率を、分かっている指標だけで平均する
  var wEf=W.w_ef||0;
  var effScore, effImputed=false;
  var calcEff=null;
  if(p.fund){
    var parts=[];
    if(p.usr)parts.push(Math.min((p.fund/p.usr)/(W.ef_full||25),1));
    var tvlEff=effTvl(p);   // 自動取得した最新TVLがあればそちらで計算する
    if(tvlEff)parts.push(Math.min((p.fund/tvlEff)/(W.et_full||3),1));
    if(parts.length)calcEff=(parts.reduce(function(a,b){return a+b;},0)/parts.length)*wEf;
  }
  var rewardEff=p.pieShare?markScore(p.pieShare,wEf):null;
  if(rewardEff!==null&&calcEff!==null){ effScore=(rewardEff+calcEff)/2; }
  else if(rewardEff!==null){ effScore=rewardEff; }
  else if(calcEff!==null){ effScore=calcEff; }
  else { var med=_effMedianCache(); effScore=(med===null)?wEf/2:med; effImputed=true; }
  // 運営の質は評価軸から廃止した。減点はリファ無・低資金の2項目のみで判定する。
  // 各項目満点(w_deduct/2)に対して○=100%・△=50%・✕=0%の達成率で加点する
  var perDeduct=(W.w_deduct||0)/2;
  var deductScore=perDeduct*achieveRate(p.refa)+perDeduct*achieveRate(p.low);
  var total=smScore+effScore+deductScore;
  return {total:Math.round(total), sm:smScore, smBase:smBaseScore, xBonus:xBonus, sfBonus:sfBonus,
    eff:effScore, deduct:deductScore, smPts:smPts, effImputed:effImputed};
}
// Xスコアの加点（4段階）。基準値は暫定なので、実運用を見て調整してよい
function xScoreBonus(v){
  var full=W.w_sm_x||0;
  v=num(v);
  if(!v)return 0;
  if(v>=200)return full;
  if(v>=150)return full*0.75;
  if(v>=100)return full*0.5;
  return full*0.25;
}
// スマートフォロワー数の加点（4段階）
function smartFollowerBonus(v){
  var full=W.w_sm_sf||0;
  v=num(v);
  if(!v)return 0;
  if(v>=1500)return full;
  if(v>=1000)return full*0.75;
  if(v>=500)return full*0.5;
  return full*0.25;
}
function score(p){return scoreBreakdown(p).total;}
function scoreMax(){return (W.w_sm||0)+(W.w_sm_x||0)+(W.w_sm_sf||0)+(W.w_ef||0)+(W.w_deduct||0);}
function scCls(s){var m=scoreMax()||100;var pct=s/m*100;return pct>=75?'c-g':pct>=55?'c-a':pct>=35?'c-y':'c-r';}
// ポイント表示（小数の余分なゼロを除去。負数はそのまま）
function fmtPt(v){var n=num(v);return (Math.round(n*100)/100).toString();}
// スコア内訳表示専用：小数点を四捨五入して整数化
function fmtPtR(v){return Math.round(num(v)).toString();}
// ○△✕は文字フォントに依存すると、環境によってサイズ・位置・太さが大きくバラつく
// （実機iOSでは「✖」が極端に小さく表示される等）。フォントに頼らず、SVGで
// 同じviewBox・同じ線の太さで統一して描画することで、どの環境でも同じ見た目にする。
function symIconSvg(v){
  if(v==='g')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="12" cy="12" r="8"></circle></svg>';
  if(v==='m')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M12 4 L21 20 L3 20 Z"></path></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>';
}
function msym(v){var c=v==='g'?'ms-g':v==='m'?'ms-m':'ms-b';return '<span class="ms ms-svg '+c+'">'+symIconSvg(v)+'</span>';}
function plCls(v){return v==='g'?'pl-g':v==='m'?'pl-m':'pl-b';}
function ini(s){return(s||'?')[0].toUpperCase();}

// ─────────── セキュリティ: 出力エスケープ & 入力検証 ───────────
// テキストとして安全にエスケープ（<,>,&,",' を実体参照化）
function esc(s){
  if(s===null||s===undefined)return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
// 数値として安全化（数値以外は0、有限数のみ）
function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
// 調達額の表示。元データはM単位なので、1000M(=1B)以上ならB表記にして桁数を短くする。
// これで統計行の横幅に余裕ができ、隣接するTVL・収益列の増減が収まりやすくなる
function fmtFundM(v){
  v=num(v);
  if(!v)return '—';
  if(v>=1000)return (Math.round(v/100)/10)+'B';
  return v+'M';
}
// ±ボタン: 入力欄の符号を反転（テンキーでマイナスが打てない問題の対策）
function toggleSign(id){
  var el=document.getElementById(id);
  if(!el)return;
  var v=(el.value||'').trim();
  if(v===''||v==='0'){el.value='-';el.focus();return;} // 空なら−を置いてマイナス入力開始
  if(v==='-'){el.value='';el.focus();return;}
  if(v.charAt(0)==='-'){el.value=v.slice(1);}else{el.value='-'+v;}
  // 変更を即反映（onchangeを発火）
  if(typeof el.onchange==='function'){el.onchange();}
  else{var ev=document.createEvent('HTMLEvents');ev.initEvent('change',true,false);el.dispatchEvent(ev);}
}
// 数値表示（空ならそのまま空文字。XSS無効化のため数値化）
function numOrEmpty(v){if(v===''||v===null||v===undefined)return '';var n=parseFloat(v);return isFinite(n)?n:'';}
// カラー値として安全化（#hex か rgb(...) のみ許可、それ以外は既定色）
function safeColor(c){
  if(typeof c!=='string')return '#888';
  return /^#[0-9a-fA-F]{3,8}$/.test(c)||/^rgba?\([\d.,\s%]+\)$/.test(c)?c:'#888';
}
// 画像URLとして安全化（data:image か https のみ許可。javascript: 等を拒否）
function safeImg(u){
  if(typeof u!=='string')return '';
  return /^data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=\s]*$/.test(u)||/^https:\/\//.test(u)?u:'';
}
// Xハンドルとして安全化（英数・_ のみ、最大32字）
function safeHandle(h){
  if(typeof h!=='string')return '';
  return h.replace(/[^A-Za-z0-9_]/g,'').slice(0,32);
}
// URLとして安全化（http/https のみ許可、javascript: 等を遮断）
function safeUrl(u){
  if(typeof u!=='string')return '';
  u=u.trim();
  if(!u)return '';
  if(/^https?:\/\/[^\s"'<>]+$/i.test(u))return u.slice(0,400);
  return '';
}

  if(hasWithdrawal(p))return avgBalanceUsd(p);
  var b=balanceUsd(p);
  if(b>0)return b;
  return num(p.totalUsd)>0?num(p.totalUsd):b;
}
// 最初の預入からの月数 / 期間テキスト（ヶ月→無ければ日）
function depMonths(p){var s=firstDepDate(p);return s?mos(s,p.endDate||null):0;}
function depPeriodTxt(p){
  if(num(p.periodOverrideMonths)>0){ // 手動上書き優先
    var rm=Math.round(num(p.periodOverrideMonths)*10)/10;
    return (rm%1===0?String(Math.round(rm)):rm.toFixed(1))+'ヶ月';
  }
  var d=heldDays(p);if(d<=0)return '';var m=d/30.44;var r=Math.round(m*10)/10;if(r<0.1)r=0.1;return (r%1===0?String(Math.round(r)):r.toFixed(1))+'ヶ月';
}
// 削り額（消費したドル）
function burnAmt(p){return p?Math.max(0,num(p.burnUsd)):0;}
// 保有日数（開始〜終了 or 現在）。月数が0でも日割りで使えるように日数も返す
function heldDays(p){
  var s=firstDepDate(p); if(!s)return 0;
  var a=new Date(s),b=p.endDate?new Date(p.endDate):new Date();
  return Math.max(0,Math.round((b-a)/86400000));
}
// エアドロ受取合計($)
function resultSumUsd(p){
  var su=0;(Array.isArray(p&&p.results)?p.results:[]).forEach(function(r){su+=num(r.usd);});
  return su;
}
// 年利%（預入に対して）= (エアドロ$ ÷ 元本$) × (365 ÷ 保有日数) × 100
function calcApr(p){
  var prin=principalUsd(p);
  if(prin<=0)return null;
  var su=resultSumUsd(p);
  if(su<=0)return null;
  var days=heldDays(p);
  if(days<=0)days=30; // 保有が極短なら最低30日とみなす（年利が無限大になるのを防ぐ）
  return (su/prin)*(365/days)*100;
}
// 倍率（削りに対して）= エアドロ$ ÷ 削り額$
function calcMultiple(p){
  var burn=burnAmt(p);
  if(burn<=0)return null;
  var su=resultSumUsd(p);
  if(su<=0)return null;
  return su/burn;
}
function fmtMultiple(p){
  var m=calcMultiple(p);
  if(m==null)return '';
  return '×'+(m>=100?Math.round(m).toLocaleString('en-US'):m>=10?m.toFixed(1):m.toFixed(2));
}
function fmtApr(p){
  var a=calcApr(p);
  if(a==null)return '';
  var v=a>=1000?Math.round(a).toLocaleString('en-US'):a>=100?a.toFixed(0):a.toFixed(1);
  return v+'%';
}
function today(){return new Date().toISOString().slice(0,10);}
// FDV換算: 自分のエアドロ$ = FDV × 割当% × (自分の量 ÷ 総量)
var FDV_LEVELS=[100,300,500,700,1000]; // 単位: M$（1000=1B）
// 閲覧者がその場で入力した値を案件IDごとに保持（保存しない・各自のアプリのみ）
// 形式: viewerAmt[pid] = {total:総配布量, mine:自分の量, alloc:割当%}
var viewerAmt={};
function getVA(pid){
  if(!viewerAmt[pid])viewerAmt[pid]={total:0,mine:0,alloc:0};
  return viewerAmt[pid];
}
function fdvShareVA(va){
  var total=num(va.total), mine=num(va.mine);
  if(total<=0||mine<=0)return 0;
  return mine/total;
}
function fdvPayoutVA(va,fdvM){
  var share=fdvShareVA(va);
  var alloc=num(va.alloc)/100;
  if(share<=0||alloc<=0)return 0;
  return fdvM*1e6*alloc*share;
}
function fmtBigUsd(v){
  v=num(v);
  if(v>=1e6)return '$'+(v/1e6).toFixed(v/1e6>=10?0:1)+'M';
  if(v>=1e3)return '$'+(v/1e3).toFixed(v/1e3>=10?0:1)+'K';
  return '$'+Math.round(v).toLocaleString('en-US');
}
function fmtFdvLevel(m){return m>=1000?(m/1000)+'B':m+'M';}
function fmtNumComma(v){
  v=num(v);
  if(v>=1e9)return (v/1e9).toFixed(v/1e9>=10?1:2)+'B';
  if(v>=1e6)return (v/1e6).toFixed(v/1e6>=10?1:2)+'M';
  return v.toLocaleString('en-US',{maximumFractionDigits:2});
}
function fmtCommaStr(v){
  if(v===''||v===null||v===undefined)return '';
  var s=String(v).replace(/,/g,'');
  if(s==='')return '';
  var neg=s.charAt(0)==='-'; if(neg)s=s.slice(1);
  var parts=s.split('.');
  var intp=parts[0].replace(/[^0-9]/g,'');
  intp=intp.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  var out=(neg?'-':'')+intp;
  if(parts.length>1)out+='.'+parts[1].replace(/[^0-9]/g,'');
  return out;
}
function fmtSharePct(share){
  var v=share*100;
  if(v<=0)return '—';
  if(v>=0.01)return v.toFixed(2)+'%';
  return v.toPrecision(2)+'%';
}
function fmtCommaField(el){
  var old=el.value, caret=el.selectionStart;
  var keyBefore=(old.slice(0,caret).match(/[0-9.]/g)||[]).length;
  var formatted=fmtCommaStr(old);
  el.value=formatted;
  var pos=0,seen=0;
  while(pos<formatted.length&&seen<keyBefore){ if(/[0-9.]/.test(formatted.charAt(pos)))seen++; pos++; }
  try{el.setSelectionRange(pos,pos);}catch(e){}
  return parseFloat(formatted.replace(/,/g,''))||0;
}
function fdvResultHtml(va,who){
  who=who||'あなた';
  var share=fdvShareVA(va);
  var rows=FDV_LEVELS.map(function(m){
    return '<div class="fdv-row">'
      +'<div class="fdv-fdv">'+fmtFdvLevel(m)+'</div>'
      +'<div class="fdv-amt">'+(share>0?fmtBigUsd(fdvPayoutVA(va,m)):'—')+'</div>'
      +'</div>';
  }).join('');
  return '<div class="fdv-share-box"><span class="fdv-in-lbl">'+esc(who)+'のシェア</span><span class="fdv-in-val">'+fmtSharePct(share)+'</span></div>'
    +'<div class="fdv-table">'
    +'<div class="fdv-row fdv-head"><div class="fdv-fdv">FDV</div><div class="fdv-amt">'+esc(who)+'の取分</div></div>'
    +rows
    +'</div>';
}
function recalcFdvField(pid,which,el){
  var v=fmtCommaField(el);
  var va=getVA(pid);
  if(which==='total')va.total=v; else if(which==='mine')va.mine=v;
  var out=document.getElementById('fdv-result-'+pid);
  if(out)out.innerHTML=fdvResultHtml(va);
}
function recalcFdvAlloc(pid,el){
  var v=parseFloat((el.value||'').replace(/[^0-9.]/g,''))||0;
  var va=getVA(pid);
  va.alloc=v;
  var out=document.getElementById('fdv-result-'+pid);
  if(out)out.innerHTML=fdvResultHtml(va);
}
// ばぶの記録値によるFDV試算（読み取り専用）。総量・ばぶの量が未入力なら表示しない。

// 年・月・日の3プルダウン（type=dateの誤確定を回避）
function starsHtml(n){
  // 空きは輪郭だけの☆にして埋まっている星と形で区別し、末尾に数字を添える。

// LIST
function sortVal(p){
  if(sortBy==='lv')return p.lv||0;
  if(sortBy==='prio')return p.prio||0;
  if(sortBy==='new')return p.createdAt||p.id||0; // 新しい順（createdAtが無い古いデータはidで代用）
  return score(p); // default 期待値
}
// 案件が「仕込み中」か（残高あり or 削り額ありで未終了）
function isActiveProj(p){
  if(p.endDate)return false;
  return p.active&&(p.totalUsd>0||burnAmt(p)>0||!!p.forceActive);
}
// エアドロ結果が出ているか（1件以上の結果が記録済み）
function hasAirdropResult(p){
  return Array.isArray(p.results)&&p.results.length>0;
}
// 「終了」＝終了日があり、かつエアドロ結果まで出ている案件のみ。
// 「スルー」＝もう仕込んでいない案件のうち、結果がまだ出ていないもの全部
//   （そもそも仕込まなかった案件 ＋ 終了日は入れたが結果がまだの案件）。
// 「終了日はあるが結果はまだ」という状態を宙に浮かせないよう、必ずどちらかに倒す設計にしている
function isEndedProj(p){
  return !!p.endDate && hasAirdropResult(p);
}
function isPassedProj(p){
  if(isActiveProj(p))return false;
  if(isEndedProj(p))return false;
  return true;
}
function flist(mode){
  var list;
  if(mode==='active')list=PROJ.filter(isActiveProj);
  else if(mode==='ended')list=PROJ.filter(isEndedProj);
  else list=PROJ.filter(isPassedProj); // 'all'（スルー案件）
  // カテゴリ絞り込み（全タブ共通。空=全カテゴリ）
  if(curF&&curF!=='all')list=list.filter(function(p){return p.cat===curF;});
  return list.slice().sort(function(a,b){
    var d=sortVal(a)-sortVal(b);
    // 期待値スコアが同点のときは、優先度→仕込みLvが高い方を上に持ってくる
    // （スコアは同じでも「どれだけ本気で仕込んでいるか」で並びを分けたいため）
    if(sortBy==='score'&&d===0){
      d=(a.prio||0)-(b.prio||0);
      if(d===0)d=(a.lv||0)-(b.lv||0);
    }
    return sortDir===1?d:-d;
  });
}
