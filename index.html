// （閲覧専用アプリ：編集モーダル・追加・削除・設定保存の機能は含まれていません）
// iOS判定
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
}
// Xを開く（x.com を新規タブで開く。iOSなら端末がXアプリへ自動誘導＝ユニバーサルリンク）
// インストール済みPWA / iOS では直接遷移する。
// → ユニバーサルリンクでXアプリ（未インストール時はSafari）が開き、戻ると元のアプリに戻れる。
// ※ window.open のアプリ内ブラウザは「戻る」で白画面になるため、PWA/iOSでは使わない。
function isStandalone(){
  return (window.navigator && window.navigator.standalone===true)
      || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}
function openXApp(appUrl,webUrl){
  markExtNav();
  if(isIOS() || isStandalone()){
    try{ window.location.assign(webUrl); }
    catch(e){ window.location.href=webUrl; }
    return;
  }
  // PC等のブラウザは新規タブ（このアプリのタブを残す）
  var w=window.open(webUrl,'_blank','noopener,noreferrer');
  if(!w){ try{ window.location.href=webUrl; }catch(e){} }
}
function openX(handle){
  var h=safeHandle(handle);
  if(!h)return;
  openXApp(null, 'https://x.com/'+h);
}
// ── 紹介リンク：コピー＆「確認してから開く」（X限定を外す代わりの安全策） ──
var _refURL='';
// メモ本文中の URL / ドメイン / @ハンドル を、タップで確認(→開く/コピー)できる安全なリンクに変換
// 1️⃣〜🔟 のOS絵文字番号を、アプリのトーンに合った番号バッジに変換（エスケープ済みテキスト専用）
function numBadgeHtml(escaped){
  return String(escaped)
    .replace(/([0-9])\uFE0F?\u20E3/g,'<span class="tl-num">$1</span>')
    .replace(/\uD83D\uDD1F/g,'<span class="tl-num">10</span>');
}
function linkifyMemo(raw,pid){
  if(!raw)return '';
  var pidAttr=(pid!=null)?' data-pid="'+esc(String(pid))+'"':'';
  var re=/(https?:\/\/[^\s<>"']+)|((?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}(?:\/[^\s<>"']*)?)|(@[A-Za-z0-9_]{1,15})/gi;
  var out='',last=0,m;
  while((m=re.exec(raw))!==null){
    out+=numBadgeHtml(esc(raw.slice(last,m.index))).replace(/\n/g,'<br>');
    var orig=m[0],token=orig,trail='',url='';
    if(!m[3]){ var tm=token.match(/[.,;:!?)\]）」』｝]+$/); if(tm){ trail=tm[0]; token=token.slice(0,token.length-trail.length); } }
    if(m[1])url=token; else if(m[2])url='https://'+token; else url='https://x.com/'+token.slice(1);
    var safe=safeUrl(url);
    var isHandle=!!m[3];
    if(safe){
      out+='<span class="memo-link" data-url="'+esc(safe)+'"'+pidAttr+' onclick="event.stopPropagation();askRef(this)">'+esc(token)+'</span>'+esc(trail);
      if(!isHandle)out+='<span class="memo-copy" data-url="'+esc(safe)+'" onclick="event.stopPropagation();copyRef(this)">🔗コピー</span>';
    }
    else out+=esc(orig);
    last=m.index+orig.length;
    // コピーボタン自体が改行相当（ブロック表示）なので、直後の改行1つは二重にしない（@ハンドルはコピー無しなので対象外）
    if(safe&&!isHandle&&raw.charAt(last)==='\n')last++;
  }
  out+=numBadgeHtml(esc(raw.slice(last))).replace(/\n/g,'<br>');
  return out;
}
// やってることの本文：[写真N]トークンを、その場で枠線付き画像に変換して表示（他の行は通常通りlinkify）
function renderTaskHtml(p){
  if(!p||!p.task)return '<span style="color:var(--t3);">未入力です</span>';
  var imgs=Array.isArray(p.taskImg)?p.taskImg:[];
  var lines=String(p.task).split(/\r?\n/);
  var html='',buf=[];
  function flush(){ if(buf.length){ html+=linkifyMemo(buf.join('\n'),p.id); buf=[]; } }
  lines.forEach(function(line){
    var m=line.trim().match(/^\[写真(\d+)\]$/);
    if(m){
      var src=imgs[parseInt(m[1],10)-1];
      if(src&&safeImg(src)){ flush(); html+='<img class="task-img" src="'+esc(src)+'" alt="添付画像">'; return; }
    }
    buf.push(line);
  });
  flush();
  return html;
}
// TGE予定の記号（○有/△匂わせ/×無、未設定は空）
function tgeSym(v){
  if(v==='g')return '<span class="tge-g"><span class="tge-ico tge-ico-svg">'+symIconSvg('g')+'</span> 有</span>';
  if(v==='m')return '<span class="tge-m"><span class="tge-ico tge-ico-svg">'+symIconSvg('m')+'</span> 匂わせ</span>';
  if(v==='b')return '<span class="tge-b"><span class="tge-ico tge-ico-svg">'+symIconSvg('b')+'</span> 無</span>';
  return '';
}
// アーリー度：開始〜終了予定に対する現在位置を横帯で可視化（コンパクト）
// 序盤=緑／中盤=黄／終盤=赤 で色分け（終了日の有無どちらでも）
function earlyFillGrad(stage){
  // 赤(終盤)の「淡い色→リッチな色」の奥行き感を、緑・黄にも揃える
  return stage==='g'?'linear-gradient(90deg,#a8f5cd,#22c176)':stage==='m'?'linear-gradient(90deg,#ffe6a3,#f0a730)':'linear-gradient(90deg,#ff8a6a,#ff5c5c)';
}
// アーリー度バーが「終了」表示になる案件か（＝仕込み終了かつ案件自体も終わっている）。
// カード全体を薄くして、まだ終わっていない案件を目立たせるために使う。
function earlyIsOver(p){
  if(!p||!p.earlyStart||!p.earlyEnd)return false;
  var t0=new Date(p.earlyStart+'T00:00:00').getTime();
  var t1=new Date(p.earlyEnd+'T00:00:00').getTime();
  if(!isFinite(t0)||!isFinite(t1)||!(t1>t0))return false; // earlyHtml側で描画されない条件は対象外
  return t1-Date.now()<=0;
}
function earlyHtml(p){
  if(!p.earlyStart)return '';
  function fmtD(d){return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();}
  var tgeTail=p.tge?'<span class="early-sep"></span><span class="early-wk">TGE予定：</span>'+tgeSym(p.tge):'';
  var d0=new Date(p.earlyStart+'T00:00:00');
  // 終了予定日が未入力：経過期間から簡易判定（3ヶ月以下=○序盤/半年経過=△中盤/1年以上=×終盤）。
  // 終了日が無いので実際の進捗%は出せないが、段階だけは分かるので固定位置（25/50/75%）のバーを表示する
  if(!p.earlyEnd){
    var elapsedDays=Math.max(0,Math.floor((Date.now()-d0.getTime())/86400000));
    var elapsedMonths=elapsedDays/30.44;
    var stage=elapsedMonths<=6?'g':elapsedMonths<12?'m':'b';
    var emk = stage==='g'?'<span class="tge-g"><span class="tge-ico tge-ico-svg">'+symIconSvg('g')+'</span> 序盤</span>' : stage==='m'?'<span class="tge-m"><span class="tge-ico tge-ico-svg">'+symIconSvg('m')+'</span> 中盤</span>' : '<span class="tge-b"><span class="tge-ico tge-ico-svg">'+symIconSvg('b')+'</span> 終盤</span>';
    var fixedPct=stage==='g'?25:stage==='m'?50:75;
    var tmE=Math.floor(elapsedDays/30.44);
    var eyE=Math.floor(tmE/12),emE=tmE%12,ewE=Math.round(elapsedDays/7);
    var elapsedTxt=(eyE>0?eyE+'年':'')+(emE>0?emE+'ヶ月':'')||(ewE>0?ewE+'週':'1週未満');
    return '<div class="early-wrap">'
      +'<div class="early-top"><span class="early-lbl"><span class="q-icon q-icon-early"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"></path><path d="M5 4h13l-3 4 3 4H5"></path></svg></span>アーリー度</span><span class="early-gap"></span>'+emk+tgeTail+'</div>'
      +'<div class="early-track"><div class="early-fill" style="width:'+fixedPct+'%;background:'+earlyFillGrad(stage)+';"></div></div>'
      +'<div class="early-dates"><span class="early-date-w"><span class="early-lbl-w">開始</span> '+fmtD(d0)+'</span><span class="early-pct-mid">'+elapsedTxt+' <span class="early-lbl-w">経過</span></span><span class="early-date-w"><span class="early-lbl-w">終了</span> 不明</span></div>'
      +'</div>';
  }
  var d1=new Date(p.earlyEnd+'T00:00:00');
  var t0=d0.getTime(),t1=d1.getTime(),now=Date.now();
  if(!(t1>t0))return '';
  var totalW=Math.max(1,Math.round((t1-t0)/(7*86400000)));
  var curW=Math.floor((now-t0)/(7*86400000));
  var pct=Math.max(0,Math.min(100,Math.round((now-t0)/(t1-t0)*100)));
  var curWClamped=Math.max(0,Math.min(totalW,curW));
  // アーリー度の評価：序盤ほどアーリー（○）、終盤は×（TGE予定と同じ配色・記号に統一）
  var stage2 = pct<33?'g':pct<70?'m':'b';
  // 残り期間（日数→年月換算）
  var remDays=Math.round((t1-now)/86400000);
  var remTxt;
  if(remDays<=0){remTxt='終了';}
  else{
    var remMonths=remDays/30.44;
    if(remMonths>=1){
      remTxt=(Math.round(remMonths*10)/10)+'ヶ月';
    }else{
      var rw=Math.round(remDays/7);
      remTxt=rw>0?(rw+'週'):'1週未満';
    }
  }
  // 完全に終了した案件は「終盤」＋別枠の「終了」を重ねて出さず、赤字の「×終了」だけにまとめる
  var mark = stage2==='g'?'<span class="tge-g"><span class="tge-ico tge-ico-svg">'+symIconSvg('g')+'</span> 序盤</span>' : stage2==='m'?'<span class="tge-m"><span class="tge-ico tge-ico-svg">'+symIconSvg('m')+'</span> 中盤</span>' : (remDays<=0?'<span class="tge-b"><span class="tge-ico tge-ico-svg">'+symIconSvg('b')+'</span> 終了</span>':'<span class="tge-b"><span class="tge-ico tge-ico-svg">'+symIconSvg('b')+'</span> 終盤</span>');
  // 上段は状態バッジのみ（終了済みも上の mark に統合済みなので別枠表示は無し）
  var topInner='';
  var pctMid=pct+'%（'+curWClamped+'週/'+totalW+'週）';
  return '<div class="early-wrap">'
    +'<div class="early-top"><span class="early-lbl"><span class="q-icon q-icon-early"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"></path><path d="M5 4h13l-3 4 3 4H5"></path></svg></span>アーリー度</span><span class="early-gap"></span>'+mark+(topInner?'<span class="early-sep"></span>'+topInner:'')+tgeTail+'</div>'
    +'<div class="early-track"><div class="early-fill" style="width:'+pct+'%;background:'+earlyFillGrad(stage2)+';"></div></div>'
    +'<div class="early-dates"><span class="early-date-w"><span class="early-lbl-w">開始</span> '+fmtD(d0)+'</span><span class="early-pct-mid">'+pctMid+'</span><span class="early-date-w"><span class="early-lbl-w">終了</span> '+fmtD(d1)+'</span></div>'
    +'</div>';
}
function copyRefFromModal(){ if(_refURL)copyToClip(_refURL); cm('m-ref'); }
function copyRef(btn){
  var u=btn.getAttribute('data-url')||'';
  if(!u)return;
  copyToClip(u);
}
function copyToClip(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){showToast('リンクをコピーしました');},function(){fallbackCopy(text);});
  }else{fallbackCopy(text);}
}
function fallbackCopy(text){
  try{
    var ta=document.createElement('textarea');
    ta.value=text;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.top='-1000px';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    var ok=document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(ok?'リンクをコピーしました':'コピーできませんでした');
  }catch(e){showToast('コピーできませんでした');}
}

function openUrl(u){

  if(mu){ openXApp('twitter://user?screen_name='+mu[1], url); return; }
  // それ以外は通常リンク
  if(isIOS()){ window.location.href=url; }
  else { var w=window.open(url,'_blank','noopener,noreferrer'); if(!w){try{window.top.location.href=url;}catch(e){window.location.href=url;}} }
}
// カード全体タップで開く（閉じるのは専用の「✕閉じる」バーのみが担当。開いた状態で本文をタップしても閉じない）
function cardTapOpen(mode,idx){
  var btn=document.getElementById('dt-btn-'+mode+'-'+idx);
  if(btn&&!btn.classList.contains('open'))toggleDetail(mode,idx);
}
var openDetailKeys={}; // {'active:12':true} 開いている詳細を案件ID単位で記憶（再描画で勝手に閉じるのを防ぐ）
function toggleDetail(mode,idx){
  var key=mode+'-'+idx;
  var body=document.getElementById('dt-body-'+key);
  var btn=document.getElementById('dt-btn-'+key);
  if(!body||!btn)return;
  var open=btn.classList.contains('open'); // 表示状態はアニメーション中も即座に切り替わるボタン側で判定
  var card=btn.closest('.proj-card');
  var okey=(card&&card.dataset&&card.dataset.pid!=null)?(mode+':'+card.dataset.pid):null;
  if(open){
    if(okey)delete openDetailKeys[okey];
    btn.classList.remove('open');
    if(card)card.classList.remove('dt-open');
    btn.querySelector('.dt-label').textContent='詳細を見る';
    animateFold(body,false);
    try{ btn.scrollIntoView({block:'nearest'}); }catch(e){}
  }else{
    if(okey)openDetailKeys[okey]=true;
    btn.classList.add('open');
    if(card)card.classList.add('dt-open');
    btn.querySelector('.dt-label').textContent='✕ 閉じる';
    animateFold(body,true);
    var dhRow=body.querySelector('.dh-row');
    if(dhRow){
      scrollFoldTop(dhRow,btn.getBoundingClientRect().height); // sticky「✕閉じる」バーの高さ分は手前で止め、見出しが隠れないようにする
    }else{
      scrollFoldTop(card);
    }
  }
}
// ランキングの案件行タップ→「仕込み終了」タブの該当カードへ移動し、詳細を開いた状態にする
function jumpToProject(pid,skipExpand){
  var idx=PROJ.findIndex(function(p){return p.id===pid;});
  if(idx<0)return;
  // 以前その案件を開いた記憶が残っていると、飛んだ先で開いたまま表示されてしまうので先に消しておく
  if(skipExpand){ delete openDetailKeys['ended:'+pid]; renderList('list-ended','ended'); }
  var navBtn=document.getElementById('bni-ended');
  sv('ended',navBtn,'b');
  setTimeout(function(){
    var body=document.getElementById('dt-body-ended-'+idx);
    var btn=document.getElementById('dt-btn-ended-'+idx);
    if(!skipExpand&&body&&btn&&!btn.classList.contains('open'))toggleDetail('ended',idx);
    var card=btn&&btn.closest('.proj-card');
    if(card)card.scrollIntoView({behavior:'smooth',block:'start'});
  },60);
}

document.querySelectorAll('.modal-overlay').forEach(function(el){

function renderTabs(){
  var el=document.getElementById('ftabs');if(!el)return;
  var all='<button class="ftab'+(curF==='all'?' active':'')+'" onclick="setF(\'all\')">すべて</button>';
  var rest=CATS.map(function(c){
    var label=c==='Free'?'無料':esc(c);
    return '<button class="ftab'+(curF===c?' active':'')+'" onclick="setF(\''+esc(safeHandle(c)||c.replace(/[^A-Za-z0-9ぁ-んァ-ヶ一-龠]/g,''))+'\')">'+label+'</button>';
  }).join('');
  el.innerHTML=all+rest;
}

function toggleSortDir(){

// カテゴリ絞り込み（ヘッダーのプルダウン。全タブ共通）
function setCatFilter(v){ curF=v||'all'; renderAll(); }
function populateCatFilter(){
  var sel=document.getElementById('cat-sel');if(!sel)return;
  var cur=curF&&curF!=='all'?curF:'';

  CATS.forEach(function(c){ html+='<option value="'+esc(c)+'"'+(c===cur?' selected':'')+'>'+esc(c)+'</option>'; });

}
function setF(cat){

  renderTabs();

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(function(){t.classList.remove('show');},2400);
}

// ─────────── 自動更新（クラウドの変更を自動で反映）───────────
// 書き込みは一切せず GET のみ。updated_at が変わった時だけ再描画する。
// （変化が無い時は再描画しない＝開いている詳細や入力中の数値を消さない）
var _refreshing=false;   // 多重取得の防止
var _lastRefreshAt=0;    // 直近チェック時刻（連打抑制）

// updated_at だけ軽量取得して変化を検知
function cloudCheckUpdated(){
  return fetch(SB_URL+'/rest/v1/app_data?id=eq.1&select=updated_at',{
    method:'GET',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
    cache:'no-store'
  }).then(function(r){return r.ok?r.json():null;})
    .then(function(rows){return (rows&&rows.length)?(rows[0].updated_at||null):null;})
    .catch(function(){return null;});
}

// クラウドを確認し、更新があれば取り直して反映する
// opts.manual=true … 手動（非表示/入力中/連打ガードを無視。結果をトースト表示）
function refreshFromCloud(opts){
  opts=opts||{};
  var manual=!!opts.manual;
  if(_refreshing)return;
  if(!manual){
    if(document.hidden)return;                              // 非表示中はスキップ
    var ae=document.activeElement;                           // 入力中は触らない（入力値を保護）
    if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
    var now=Date.now();
    if(now-_lastRefreshAt<2000)return;                       // 連打抑制
    _lastRefreshAt=now;
  }
  _refreshing=true;
  cloudCheckUpdated().then(function(ts){
    if(!ts){                                                 // 確認できず
      if(manual)showToast('⚠️ 接続を確認できませんでした');
      _refreshing=false; return;
    }
    if(_lastUpdated && ts===_lastUpdated){                    // 変化なし
      // 「更新」バッジは一度見せたら役目を終えているので、次にアプリへ戻ってきたタイミングで消す。
      // （iOSはアプリの切替・再表示だけではページを再読込しないため、ここで明示的に消さないと
      //   ずっとバッジが残ったままになってしまう＝今回のバグの原因）
      if(!manual && Object.keys(updatedPids).length){
        updatedPids={};
        renderAll();
      }
      if(manual)showToast('✅ すでに最新です');
      setCloudStatus('ok'); _refreshing=false; return;
    }
    // 変化あり（または初回未取得）→ 全データを取り直して反映
    setCloudStatus('loading');
    return cloudLoad().then(function(ok){
      if(ok){ renderTabs(); renderAll(); renderUpdated(); renderInfoText(); renderSecProof(); renderAchv(); renderScoreCheck(); renderFundAlloc(); renderStrongList(); renderStrategy(); renderTaskList(); populateCatFilter(); setCloudStatus('ok'); showToast('🔄 最新データに更新しました'); }
      else  { setCloudStatus('err'); }
      _refreshing=false;
    });
  }).catch(function(){ setCloudStatus('err'); _refreshing=false; });
}

// 状態チップ（🟢最新 等）をタップ → 今すぐ確認
(function(){
  var cs=document.getElementById('cloud-status');
  if(cs){
    cs.style.cursor='pointer';
    cs.title='タップで最新を確認';
    cs.addEventListener('click',function(){refreshFromCloud({manual:true});});
  }
})();

// ── 実ビューポート高さの監視＆自動復旧 ──
// iOSのPWAでは外部サイト(アプリ内ブラウザ)を×で閉じて戻った時にJSイベントが一切発火せず、
// さらにWebViewの高さが縮んだまま固定される既知バグがあるため、常時ウォッチドッグで監視して自動復旧する。
// ── 外部リンクを開いた印。×で戻ってきた時にアプリを自動再起動して黒帯バグを確実に回避 ──
function markExtNav(){
  if(!isIOS())return; // このバグはiOSのみ。PC等は再起動不要
  try{
    var vn=((document.querySelector('.view.active')||{}).id||'').replace('view-','');
    sessionStorage.setItem('extnav', String(Date.now()));
    if(vn)sessionStorage.setItem('extview', vn);
  }catch(e){ window._extNav=Date.now(); }
}
function maybeExtReload(){
  var t=0;
  try{ t=+(sessionStorage.getItem('extnav')||0); }catch(e){ t=window._extNav||0; }
  if(!t)return false;
  try{ sessionStorage.removeItem('extnav'); }catch(e){}
  window._extNav=0;
  if(Date.now()-t>30*60*1000)return false; // 古すぎる印は無視
  if(vhModalOpen())return false;           // モーダル表示中（編集中など）は再起動しない
  location.reload();
  return true;
}
var _vhMax=0,_vhStuck=0,_vhReloadedOnce=false;
function vhNow(){return Math.round((window.visualViewport&&window.visualViewport.height)||window.innerHeight);}
function setAppH(){
  var h=vhNow();
  if(h>_vhMax)_vhMax=h;
  document.documentElement.style.setProperty('--app-h',h+'px');
}
function vhKeyboardOpen(){
  var a=document.activeElement,t=(a&&a.tagName||'').toLowerCase();
  if(t==='input'||t==='textarea'||t==='select')return true;
  return !!(window.visualViewport&&(window.innerHeight-window.visualViewport.height)>60);
}
function vhModalOpen(){
  var m=document.querySelector('.modal-overlay');
  return !!(m&&getComputedStyle(m).display!=='none');
}
// 高さの数値は正常でも、描画だけが下にズレて黒帯が残る（表示位置オフセット）ケースを検知
function vhOffsetBug(){
  var v=window.visualViewport;
  if(!v||vhKeyboardOpen())return false;
  return (v.offsetTop>1)||(v.pageTop>1)||(v.offsetLeft>1);
}
// WKWebViewにレイアウト＆合成レイヤの再構築を強制して黒帯を復旧させる
function vhJiggle(){
  try{
    window.scrollTo(0,1);window.scrollTo(0,0);
    if(document.scrollingElement)document.scrollingElement.scrollTop=0;
    var de=document.documentElement,b=document.body;
    de.style.minHeight='100.5vh';
    if(b)b.style.transform='translateZ(0)';
    requestAnimationFrame(function(){
      void de.offsetHeight;
      de.style.minHeight='';
      if(b){
        b.style.display='none';
        void b.offsetHeight; // 強制リフロー（同一フレーム内のため見た目はチラつかない）
        b.style.display='';
        b.style.transform='';
      }
      window.scrollTo(0,0);
      setAppH();
    });
  }catch(e){}
}
// 外部サイト（アプリ内ブラウザ）から戻った直後は、数値が正常でも無条件で復旧を実行
function vhRecover(){
  if(maybeExtReload())return;
  setAppH();
  vhJiggle();
  [250,700,1400].forEach(function(ms){setTimeout(function(){setAppH();if(vhOffsetBug())vhJiggle();},ms);});
}
setAppH();
window.addEventListener('resize',setAppH);
window.addEventListener('orientationchange',function(){_vhMax=0;setTimeout(vhRecover,300);});
window.addEventListener('pageshow',vhRecover);
window.addEventListener('focus',vhRecover);
document.addEventListener('visibilitychange',function(){if(!document.hidden)vhRecover();});
if(window.visualViewport){window.visualViewport.addEventListener('resize',setAppH);}
setInterval(function(){
  setAppH();
  if(vhKeyboardOpen()){_vhStuck=0;return;}
  if(_vhMax-vhNow()>120||vhOffsetBug()){
    _vhStuck++;
    if(_vhStuck===3)vhJiggle();          // 約1秒: 再レイアウト強制
    if(_vhStuck===9&&!vhModalOpen()){    // 約3秒: 最終手段=リロード（連続実行はガード）
      var ok=true;
      try{
        var ts=+(sessionStorage.getItem('vhfix')||0);
        if(Date.now()-ts<15000)ok=false;else sessionStorage.setItem('vhfix',String(Date.now()));
      }catch(e){ if(_vhReloadedOnce)ok=false;_vhReloadedOnce=true; }
      if(ok)location.reload();
    }
  }else{_vhStuck=0;}
},350);

// 入力欄フォーカス時、キーボード表示後に対象を可視領域中央へスクロール（黒い余白バグ対策）
document.addEventListener('focusin',function(e){
  var t=e.target,tag=(t&&t.tagName||'').toLowerCase();
  if(tag!=='input'&&tag!=='textarea')return;
  setTimeout(function(){ setAppH(); try{t.scrollIntoView({block:'center'});}catch(_){}} ,300);
});

// アプリに戻った／再表示された時に自動チェック（iOSのPWAでも効くように複数イベントを使用）
document.addEventListener('visibilitychange',function(){ if(!document.hidden)refreshFromCloud(); });
window.addEventListener('focus',function(){ refreshFromCloud(); });
window.addEventListener('pageshow',function(e){ if(e.persisted)refreshFromCloud(); }); // bfcache復帰
window.addEventListener('online',function(){ refreshFromCloud(); });

// 開きっぱなしでも、日付が変わった瞬間にタスク日課のチェックを自動リセットする
var _taskCheckDate=taskCheckToday();
setInterval(function(){
  var d=taskCheckToday();
  if(d!==_taskCheckDate){ _taskCheckDate=d; renderTaskList(); }
},30000);

// 開きっぱなしでも反映されるよう、表示中は一定間隔でチェック（非表示中は内部でスキップ）
setInterval(function(){ refreshFromCloud(); },30000);

// 起動：まずキャッシュを即描画（待ち時間ゼロ）→ その裏でクラウドの最新を取りに行く
renderTabs();
var _hadCache=bootFromCache();
if(_hadCache){
  // 既に前回のデータがあるので、すぐに本物の画面を表示する
  setCloudStatus('ok');
  renderAll();
  renderUpdated();
  renderInfoText();
  renderSecProof();
  renderAchv();
  renderScoreCheck();
  renderFundAlloc();
  renderStrongList();
  renderStrategy();
  renderTaskList();
  renderCalendar();
  populateCatFilter();
}else{
  renderListSkeleton(); // 初回のみ：まだ何も持っていないので読み込み表示
}
initData(_hadCache).then(function(res){
  if(res===true){ renderTabs(); renderAll(); renderCalendar(); } // 内容が変わっていた時だけ描き直す
  // 自動再起動から復帰した場合、開いていたタブへ戻す
  try{
    var rv=sessionStorage.getItem('extview');
    if(rv){ sessionStorage.removeItem('extview'); if(document.getElementById('view-'+rv)) sv(rv,null,'b'); }
  }catch(e){}
});
